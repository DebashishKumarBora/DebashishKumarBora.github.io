<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance Review | Vertex demo</title>
<style>
:root{
  --ink:#000000; --ink2:#2E2F30; --muted:#626466; --gray:#A8AAAB; --rule:#D6D7D8; --hair:#E8E9EA;
  --shade:#F3F3F3; --shade2:#F8F8F8; --paper:#FFFFFF; --gold:#CDA176;
  --serif:"Adobe Garamond Pro","EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  --sans:Calibri,Carlito,"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:lining-nums}
h1,h2,h3,h4,th,b,strong{font-weight:400}
h1,h2,h3,.tv,.bv,.mv,.lh,.rn,.fvals .v,.cword,.cover h1,.closing h1,.s-tile .tv,.s-big .bv,.s-recs .rn{font-feature-settings:"lnum" 1;font-variant-numeric:lining-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hide{display:none !important}
.muted{color:var(--muted)}
.tiny{font-size:12px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;border-right:1px solid var(--hair);padding:30px 18px 22px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#fff;z-index:6}
.brand{padding:0 10px 26px}
.brand .word{font-family:var(--serif);font-size:25px;letter-spacing:.46em;line-height:1}
.brand .sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:block;padding:8px 12px;border-radius:6px;text-decoration:none;font-size:15px;color:var(--ink)}
.nav a:hover{background:var(--shade2)}
.nav a.on{background:var(--shade)}
.nav .subnav{display:flex;flex-direction:column;margin:2px 0 8px}
.nav .subnav a{padding:5px 12px 5px 26px;font-size:14px;color:var(--ink2)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--hair);font-size:13px;color:var(--ink2);word-break:break-all}
.main{flex:1;min-width:0}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--hair);padding:14px 40px 14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.field{display:flex;flex-direction:column;min-width:0}
.field>label,.flabel{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.field .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
select,input[type=date],input[type=text],input[type=password],input[type=number],input[type=email],textarea{border:1px solid var(--rule);border-radius:6px;padding:7px 10px;background:#fff;min-height:38px;font-size:15px;max-width:100%}
textarea{min-height:80px;width:100%;resize:vertical;line-height:1.45}
select:focus,input:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.btn{border:1px solid var(--ink);background:#fff;border-radius:6px;padding:7px 14px;font-size:15px;cursor:pointer;min-height:38px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--shade2)}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:#222}
.btn.ghost{border-color:var(--rule)}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gray);cursor:pointer}
.bar-actions{margin-left:auto;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menu-list{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:6px;min-width:200px;z-index:20}
.menu-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:15px}
.menu-list button:hover{background:var(--shade)}
.content{padding:26px 40px 90px;max-width:1720px}
.rangeline{font-size:14px;color:var(--muted);padding-bottom:6px}
.sep{margin:0 8px;color:var(--gray)}
.banner{border:1px solid var(--rule);background:var(--shade2);border-radius:8px;padding:12px 16px;margin:12px 0;font-size:15px}
.banner .t{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}

/* ---------- type ---------- */
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1.hero{font-family:var(--serif);font-size:42px;line-height:1.14;margin:10px 0 14px;max-width:1180px;letter-spacing:-.005em}
h2.sec{font-family:var(--serif);font-size:32px;line-height:1.2;margin:6px 0 8px}
h3{font-family:var(--serif);font-size:22px;line-height:1.25;margin:4px 0 6px}
.lede{font-size:18px;color:var(--ink2);max-width:1120px;margin:0 0 6px}
.intro{font-size:17px;color:var(--ink2);max-width:1120px;margin:0 0 18px}
.ai-sum{font-size:18px;color:var(--ink2);max-width:1120px;margin:6px 0 4px}
.ai-note{font-size:12px;color:var(--muted);margin:4px 0 0}
section.rep{padding:30px 0 42px;border-top:1px solid var(--rule);scroll-margin-top:96px}
section.rep:first-of-type{border-top:0;padding-top:10px}
.subhead{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}

/* ---------- tiles and boxes ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0 8px}
@media (min-width:1400px){.content .tiles{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{border:1px solid var(--hair);background:var(--shade2);border-radius:8px;padding:16px 18px 14px;min-width:0}
.tile .tl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tile .tv{font-family:var(--serif);font-size:34px;line-height:1.1;margin:8px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tc{font-size:13px;color:var(--muted);margin-bottom:6px}
.tile .tt{font-size:12px;color:var(--muted);margin-top:6px}
.chip{font-size:13px;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;position:relative}
.chip .mk{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;flex:none}
.chip.good .mk{background:var(--gold)}
.chip.weak .mk{border:1.5px solid var(--muted);width:7px;height:7px}
.chip.neutral .mk,.chip.na .mk{display:none}
.chip.na{color:var(--muted)}
.boxes{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}
.boxes>.box{flex:1 1 220px}
.box{background:var(--shade);border-radius:8px;padding:18px 20px;min-width:0}
.box .bl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.box .bv{font-family:var(--serif);font-size:32px;line-height:1.1;margin:8px 0 4px}
.box .bs{font-size:13px;color:var(--muted)}

/* ---------- cards ---------- */
.cards{display:flex;flex-wrap:wrap;gap:14px;margin:16px 0;align-items:stretch}
.cards>.card{flex:1 1 320px}
.cards.three>.card{flex:1 1 260px}
.card{border:1px solid var(--hair);border-radius:8px;padding:18px 20px 16px;background:#fff;min-width:0;display:flex;flex-direction:column}
.card p{margin:6px 0;font-size:15px;color:var(--ink2)}
.card.win{border-top:2px solid var(--ink)}
.card.win.lead{border-top-color:var(--gold)}
.card.limit{border-left:2px solid var(--gray)}
.metric{margin:4px 0 2px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.metric .mv{font-family:var(--serif);font-size:30px;line-height:1.1}
.metric .ml{font-size:13px;color:var(--muted)}
.lh{font-family:var(--serif);font-size:20px;line-height:1.3;margin:2px 0 4px}
.sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}
ul.why{margin:4px 0 2px;padding-left:18px;font-size:15px;color:var(--ink2)}
ul.why li{margin:3px 0}
.next{font-size:15px}
.impact{font-size:14px;color:var(--muted)}
.note{background:var(--shade2);border-radius:6px;padding:8px 12px;margin-top:10px}
.note p{margin:2px 0}
.acts{margin-top:auto;padding-top:12px;display:flex;gap:16px;flex-wrap:wrap}
.recs{list-style:none;margin:16px 0;padding:0;counter-reset:r}
.recs li{display:grid;grid-template-columns:56px 1fr;gap:6px 14px;padding:18px 0;border-top:1px solid var(--hair)}
.recs li:first-child{border-top:0}
.recs .rn{font-family:var(--serif);font-size:38px;line-height:1}
.recs h3{margin:0 0 4px}
.recs p{margin:4px 0;color:var(--ink2);font-size:15px}
.why-wrap{margin:22px 0 0;border-top:1px solid var(--hair);padding-top:18px}
.why-panel{margin-top:14px;background:var(--shade2);border-radius:8px;padding:6px 24px 14px}
.why-panel .recs li{grid-template-columns:52px 1fr}
.why-panel .ev{margin:6px 0 2px;padding-left:18px;font-size:14px;color:var(--muted)}
.why-panel .ev li{display:list-item;border:0;padding:1px 0}
.why-panel .src{font-size:12px;color:var(--muted);padding:12px 0 2px}
.why-panel .chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.empty{padding:22px;border:1px dashed var(--rule);border-radius:8px;color:var(--muted);font-size:15px}

/* ---------- status strip ---------- */
.strip{margin:22px 0 4px}
.sbar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;background:#fff}
.sbar i{display:block;height:100%}
.skey{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px;color:var(--ink2)}
.skey button{background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:14px}
.skey .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.st-improved{background:#000}.st-steady{background:#A8AAAB}.st-new{background:#D6D7D8}.st-attention{background:#626466}.st-ended{background:#EDEDED}.st-idle{background:#F3F3F3}

/* ---------- charts ---------- */
.chart-card{border:1px solid var(--hair);border-radius:8px;padding:16px 18px 10px;margin:16px 0;min-width:0}
.chart-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.chart-head h3{margin:0;font-size:20px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.legend .k i{width:12px;height:12px;border-radius:2px;display:inline-block}
.legend .k i.ln{height:2px;width:16px;border-radius:1px}
.k1{background:#000}.k2{background:#A8AAAB}
.chart{width:100%;min-height:60px;position:relative}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--hair);stroke-width:1}
.chart .base{stroke:var(--rule);stroke-width:1}
.chart .ax{font-family:var(--sans);font-size:12px;fill:var(--muted)}
.chart .vl{font-family:var(--sans);font-size:12px;fill:var(--ink2)}
.chart .b1{fill:#000}.chart .b2{fill:#A8AAAB}
.chart .l1{stroke:#000;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .l2{stroke:#A8AAAB;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .d1{fill:#000;stroke:#fff;stroke-width:2}.chart .d2{fill:#A8AAAB;stroke:#fff;stroke-width:2}
.chart .mkline{stroke:var(--ink);stroke-width:1}
.chart .mktext{font-family:var(--sans);font-size:12px;fill:var(--ink2)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:rgba(0,0,0,.04)}
.chart-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.tip{position:fixed;z-index:60;pointer-events:none;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:8px 11px;font-size:13px;line-height:1.45;color:var(--ink);max-width:280px;display:none}
.tip .th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.funnel{margin:10px 0}
.fstage{display:grid;grid-template-columns:150px 1fr 190px;gap:8px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--hair)}
.fstage:first-child{border-top:0}
.fstage .fn{font-family:var(--serif);font-size:20px;line-height:1.15}
.fbars{display:flex;flex-direction:column;gap:2px;min-width:0}
.fbars i{display:block;height:12px;border-radius:0 4px 4px 0;min-width:2px}
.fvals{text-align:right;font-variant-numeric:lining-nums tabular-nums}
.fvals .v{font-family:var(--serif);font-size:24px;line-height:1.1}
.fvals .c{font-size:13px;color:var(--muted)}
.frate{font-size:13px;color:var(--muted);padding:2px 0 2px 166px}

/* ---------- tables ---------- */
.tw{position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:lining-nums tabular-nums}
.t th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--ink);text-align:right;white-space:nowrap;vertical-align:bottom}
.t td{padding:10px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap;vertical-align:top}
.t .l{text-align:left}
.t td.l{white-space:normal;min-width:160px}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--shade2)}
.t th[data-sort]{cursor:pointer}
.t th[data-sort]:hover{color:var(--ink)}
.t th.on{color:var(--ink)}
.t .nm{font-size:15px}
.t .meta{font-size:12px;color:var(--muted)}
.t .chip{font-size:12px}
.t tfoot td{border-top:1px solid var(--ink);border-bottom:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 4px}
.pill{border:1px solid var(--rule);border-radius:999px;padding:5px 12px;background:#fff;cursor:pointer;font-size:14px}
.pill.on{border-color:var(--ink);background:var(--ink);color:#fff}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:30;display:none}
.scrim.on{display:block}
.drawer-clip{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:31}
.drawer{position:absolute;top:0;right:0;height:100%;pointer-events:auto;width:min(680px,100vw);background:#fff;border-left:1px solid var(--rule);z-index:31;transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-in{flex:1;min-height:0;overflow-y:auto;padding:26px 28px 60px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead h2{font-family:var(--serif);font-size:32px;margin:6px 0 0;line-height:1.15}

/* ---------- next year board ---------- */
.ideas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:18px 0}
.mcard{border:1px solid var(--hair);border-radius:8px;padding:14px 18px 10px;min-width:0}
.mcard.any{grid-column:1/-1;background:var(--shade2)}
.mcard h3{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 2px}
.mcard .cnt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.idea{padding:10px 0;border-top:1px solid var(--hair)}
.mcard .ideas>.idea:first-child{border-top:0}
.idea .ttl{font-size:15px}
.idea .idet{font-size:14px;color:var(--ink2);margin:3px 0}
.idea .meta{font-size:12px;color:var(--muted);margin-top:3px}
.cat{display:inline-block;background:var(--shade);border-radius:999px;padding:1px 9px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.mcard.any .cat{background:#fff}
.mcard .none{font-size:13px;color:var(--gray);padding:8px 0 6px}

/* ---------- settings and forms ---------- */
.panel{border:1px solid var(--hair);border-radius:8px;padding:20px 22px;margin:16px 0}
.panel h3{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 18px}
.grid2 .field input,.grid2 .field select{width:100%}
.grid2 .field input[type=checkbox]{width:auto;min-height:0}
.check input{width:auto;min-height:0}
.help{font-size:13px;color:var(--muted);margin:4px 0 10px}
.status-msg{font-size:14px;color:var(--ink2);margin-left:4px}
.status-msg.err{color:var(--ink)}
.formrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:15px}
.err-panel{border:1px solid var(--ink);border-radius:8px;padding:18px 20px;margin:18px 0}
.loading{padding:60px 0;color:var(--ink2)}
.loading h2{font-family:var(--serif);font-size:30px;margin:0 0 8px}

/* ---------- present ---------- */
.present{position:fixed;inset:0;background:#1C1C1C;z-index:50;display:none;flex-direction:column}
.present.on{display:flex}
.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage-box{position:relative}
.stage{width:1280px;height:720px;transform-origin:0 0;position:absolute;left:0;top:0}
.pctl{height:56px;display:flex;align-items:center;justify-content:center;gap:14px;color:#fff;font-size:14px}
.pctl button{background:none;border:1px solid #6E7072;color:#fff;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:14px}
.pctl button:hover{border-color:#fff}

/* ---------- slides ---------- */
.slide{width:1280px;height:720px;background:#fff;color:#000;position:relative;overflow:hidden;padding:58px 80px 0;font-family:var(--sans);display:flex;flex-direction:column}
.slide .eyebrow{font-size:14px}
.slide h2{font-family:var(--serif);font-size:44px;line-height:1.12;margin:8px 0 0;max-width:1100px}
.shead{flex:none}
.sbody{flex:1;min-height:0;padding:26px 0 12px;overflow:hidden}
.sfoot{flex:none;height:54px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);letter-spacing:.04em}
.slide.dark{background:#000;color:#fff;padding:70px 90px}
.slide.dark .eyebrow{color:#A8AAAB}
.cover .cword{font-family:var(--serif);font-size:40px;letter-spacing:.5em}
.cover .crule{width:64px;height:1px;background:var(--gold);margin:34px 0 34px}
.cover h1{font-family:var(--serif);font-size:72px;line-height:1.05;margin:14px 0 18px;max-width:980px}
.cover .csub{font-size:24px;color:#D6D7D8;margin:0}
.cover .cby{position:absolute;left:90px;bottom:88px;font-size:20px;line-height:1.5}
.cover .cby span{color:#A8AAAB;font-size:16px}
.slide .ctag{position:absolute;right:90px;bottom:88px;font-family:var(--serif);font-size:20px;color:#D6D7D8}
.closing h1{font-family:var(--serif);font-size:84px;margin:150px 0 14px}
.closing p{font-size:24px;color:#D6D7D8;margin:0}
.s-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.s-tile{background:var(--shade);border-radius:8px;padding:20px 24px 18px}
.s-tile .tl{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.s-tile .tv{font-family:var(--serif);font-size:46px;line-height:1.08;margin:10px 0 4px}
.s-tile .tc{font-size:15px;color:var(--muted)}
.s-tile .chip{font-size:15px;margin-top:4px}
.s-lede{font-size:22px;color:var(--ink2);margin:0 0 22px;max-width:1080px}
.s-cols{display:grid;grid-template-columns:330px 1fr;gap:40px;height:100%}
.s-big .bl{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.s-big .bv{font-family:var(--serif);font-size:62px;line-height:1.05;margin:8px 0 6px}
.s-big .bs{font-size:17px;color:var(--ink2);margin-bottom:22px}
.s-cards{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:18px;height:100%}
.s-card{border:1px solid var(--hair);border-top:2px solid var(--ink);border-radius:8px;padding:20px 24px;overflow:hidden;min-height:0}
.s-card.lead{border-top-color:var(--gold)}
.s-card .eyebrow{font-size:12px}

.s-lim{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;height:100%}
.s-lim .s-card{border-top:1px solid var(--hair);border-left:2px solid var(--gray)}
.s-lim .s-card h3{font-size:24px}
.s-lim .lh{font-size:19px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-lim .sub{font-size:12px;margin-top:12px}
.s-lim p{-webkit-line-clamp:4;font-size:16px}
.s-recs{list-style:none;margin:0;padding:0}
.s-recs li{display:grid;grid-template-columns:60px 1fr;gap:4px 12px;padding:14px 0;border-top:1px solid var(--hair)}
.s-recs li:first-child{border-top:0;padding-top:0}
.s-recs .rn{font-family:var(--serif);font-size:36px;line-height:1}
.s-recs h3{font-size:23px;margin:0 0 2px}

.slide table.t{font-size:14.5px}
.slide .t td{padding:4px 10px;line-height:1.3}
.slide .t .chip{font-size:13px}
.slide .t th{padding:6px 10px}
.slide .chart .ax{font-size:14px}
.slide .chart .vl,.slide .chart .mktext{font-size:14px}
.slide .legend{font-size:15px}
.s-ctx{list-style:none;margin:0;padding:0}
.s-ctx li{display:grid;grid-template-columns:150px 230px 1fr;gap:16px;padding:12px 0;border-top:1px solid var(--hair);font-size:17px}
.s-ctx li:first-child{border-top:0}

#printArea{display:none}

/* ---------- small screens ---------- */
@media (max-width:900px){
  .app{flex-direction:column}
  .side{position:static;width:auto;height:auto;flex-direction:row;align-items:center;gap:12px;padding:12px 16px;border-right:0;border-bottom:1px solid var(--hair);overflow:hidden}
  .brand{padding:0;flex:none}
  .brand .word{font-size:20px}
  .brand .sub{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;min-width:0;flex:1}
  .nav .subnav{display:none}
  .nav a{white-space:nowrap;padding:7px 10px}
  .side-foot{display:none}
  .bar{position:static;padding:12px 16px}
  .bar-actions{margin-left:0}
  .content{padding:18px 16px 70px}
  h1.hero{font-size:31px}
  h2.sec{font-size:27px}
  .tile .tv{font-size:28px}
  .fstage{grid-template-columns:1fr;gap:6px}
  .fvals{text-align:left}
  .frate{padding-left:0}
  .recs li{grid-template-columns:40px 1fr}
  .recs .rn{font-size:30px}
  .drawer-in{padding:20px 16px 60px}
  .cards,.cards.three{grid-template-columns:1fr}
}
@media (max-width:420px){
  .tiles{grid-template-columns:1fr 1fr}
  .tile{padding:12px 12px 10px}
  .tile .tv{font-size:24px}
  .field{width:100%}
  .field select,.field input{width:100%}
  .field .row input[type=date]{flex:1;min-width:0}
}

/* ---------- print ---------- */
@page{size:letter;margin:0.5in}
@page slidepage{size:1280px 720px;margin:0}
@media print{
  html,body{background:#fff}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tip,.scrim,.drawer-clip,.present{display:none !important}
  body.p-slides .app{display:none !important}
  body.p-slides #printArea{display:block}
  body.p-slides #printArea .pslide{page:slidepage;break-after:page;page-break-after:always;width:1280px;height:720px;overflow:hidden}
  body.p-slides #printArea .pslide:last-child{break-after:auto;page-break-after:auto}
  body.p-report .side,body.p-report .bar,body.p-report .noprint{display:none !important}
  body.p-report .app{display:block}
  body.p-report .content{padding:0;max-width:none}
  body.p-report section.rep{break-before:page;page-break-before:always}
  body.p-report section.rep:first-of-type{break-before:auto;page-break-before:auto}
  body.p-report .card,body.p-report .chart-card,body.p-report .tile,body.p-report .recs li,body.p-report .box{break-inside:avoid;page-break-inside:avoid}
  body.p-report .tblwrap.hide{display:none !important}
}

<script>
/* Vertex Google Ads Performance Review \u00B7 client */
var S = {
  boot: null, rep: null, ai: null, aiState: 'idle', aiErr: '', view: 'report', params: null,
  req: 0, aiReq: 0, sort: { k: 'spend', d: -1 }, statusFilter: 'all', search: '',
  settings: null, context: null, ideas: null, audit: null, auditState: 'idle', auditReq: 0, open: {}, slides: [], slideIx: 0, charts: [], drawerId: null,
  loading: false, err: '', stale: false, presets: []
};
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var DIR = { spend: 0, impr: 1, clicks: 1, conv: 1, ctr: 1, cvr: 1, cpc: -1, cpa: -1, cpv: -1, per1k: 1 };
var SEP = '<span class="sep" aria-hidden="true">&middot;</span>';

/* ---------------- basics ---------------- */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function copyObj(o) { return JSON.parse(JSON.stringify(o)); }
function call(fn, args, done, fail) {
  var r = google.script.run
    .withSuccessHandler(done)
    .withFailureHandler(function (e) {
      var m = e && e.message ? e.message : String(e);
      if (fail) fail(m); else flash(m);
    });
  r[fn].apply(r, args || []);
}
function setContent(h) { $('content').innerHTML = h; }
function setText(id, t) { var el = $(id); if (el) el.textContent = t || ''; }
function flash(msg) {
  var el = $('flash');
  if (!el) {
    el = document.createElement('div');
    el.id = 'flash';
    el.className = 'banner noprint';
    $('content').insertBefore(el, $('content').firstChild);
  }
  el.innerHTML = '<span class="t">Note</span>' + esc(msg) + ' <button class="link" data-act="closeFlash">Dismiss</button>';
}

/* ---------------- formatting ---------------- */
function isNum(v) { return v !== null && v !== undefined && isFinite(v); }
function commas(n) { var s = String(Math.round(Math.abs(n))); return (n < 0 ? '-' : '') + s.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function trim1(v) { return v.toFixed(1).replace(/\.0$/, ''); }
function money(n) { if (!isNum(n)) return 'n/a'; if (Math.abs(n) < 0.005) return '$0'; return Math.abs(n) < 100 ? '$' + n.toFixed(2) : '$' + commas(n); }
function moneySigned(n) { if (!isNum(n)) return 'n/a'; return (n > 0.005 ? '+' : (n < -0.005 ? '-' : '')) + money(Math.abs(n)); }
function moneyK(n) {
  if (!isNum(n)) return '';
  var a = Math.abs(n);
  if (a >= 1e6) return '$' + trim1(n / 1e6) + 'M';
  if (a >= 1e4) return '$' + Math.round(n / 1e3) + 'K';
  if (a >= 1e3) return '$' + trim1(n / 1e3) + 'K';
  if (a > 0 && a < 10) return '$' + trim1(n);
  return '$' + Math.round(n);
}
function num(n) { if (!isNum(n)) return 'n/a'; if (Math.abs(n) < 10 && Math.abs(n - Math.round(n)) > 0.05) return n.toFixed(1); return commas(n); }
function numK(n) {
  if (!isNum(n)) return '';
  var a = Math.abs(n);
  if (a >= 1e6) return trim1(n / 1e6) + 'M';
  if (a >= 1e4) return Math.round(n / 1e3) + 'K';
  if (a >= 1e3) return trim1(n / 1e3) + 'K';
  return trim1(n);
}
function pct(f) {
  if (!isNum(f)) return 'n/a';
  var v = Math.abs(f) * 100;
  if (v < 10) return (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, '') + '%';
  return commas(v) + '%';
}
function rate(f) { if (!isNum(f)) return 'n/a'; var v = f * 100; return (v < 10 ? v.toFixed(2) : v.toFixed(1)) + '%'; }
function share(f) { if (!isNum(f)) return 'n/a'; return Math.round(f * 100) + '%'; }
function upDown(f) { if (!isNum(f)) return 'no comparison'; if (Math.abs(f) < 0.005) return 'flat'; return (f > 0 ? 'up ' : 'down ') + pct(f); }
function fmtBy(k, v) {
  if (k === 'spend' || k === 'cpa' || k === 'cpc') return money(v);
  if (k === 'ctr' || k === 'cvr') return rate(v);
  if (k === 'cpv') return isNum(v) ? (v < 10 ? v.toFixed(2) : commas(v)) : 'n/a';
  return num(v);
}
function favOf(k, chg) {
  var d = DIR[k];
  if (!d || !isNum(chg)) return null;
  if (chg * d > 0.0005) return true;
  if (chg * d < -0.0005) return false;
  return null;
}
function chip(chg, fav) {
  if (!isNum(chg)) return '<span class="chip na">No comparison</span>';
  var flat = Math.abs(chg) < 0.0005;
  var arrow = flat ? '' : (chg > 0 ? '\u25B2 ' : '\u25BC ');
  var cls = fav === true ? 'good' : (fav === false ? 'weak' : 'neutral');
  var title = fav === true ? 'Better than the comparison period' : (fav === false ? 'Weaker than the comparison period' : 'Change from the comparison period');
  return '<span class="chip ' + cls + '" title="' + title + '"><i class="mk" aria-hidden="true"></i>' + (flat ? 'Flat' : arrow + pct(chg)) + '<span class="sr"> ' + title + '</span></span>';
}

/* ---------------- dates ---------------- */
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function dP(s) { var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function dS(d) { return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
function dAdd(s, n) { var d = dP(s); d.setUTCDate(d.getUTCDate() + n); return dS(d); }
function validD(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && dS(dP(s)) === s; }
function shiftYear(s, n) { var p = s.split('-'), y = +p[0] + n, m = +p[1], d = +p[2]; if (m === 2 && d === 29) d = 28; return dS(new Date(Date.UTC(y, m - 1, d))); }
function presets(b) {
  var y = b.yesterday, Y = +y.slice(0, 4), M = +y.slice(5, 7), list = [];
  list.push({ k: 'l12', label: 'Last 12 months', start: dAdd(y, -364), end: y });
  list.push({ k: 'ytd', label: 'Year to date', start: Y + '-01-01', end: y });
  list.push({ k: 'l30', label: 'Last 30 days', start: dAdd(y, -29), end: y });
  list.push({ k: 'l90', label: 'Last 90 days', start: dAdd(y, -89), end: y });
  var lmEnd = dAdd(y.slice(0, 7) + '-01', -1);
  list.push({ k: 'lm', label: 'Last full month (' + MONTH[+lmEnd.slice(5, 7) - 1] + ')', start: lmEnd.slice(0, 7) + '-01', end: lmEnd });
  var q = Math.floor((M - 1) / 3), qEnd = q * 3, qY = Y;
  if (qEnd === 0) { qEnd = 12; qY = Y - 1; }
  list.push({ k: 'lq', label: 'Last full quarter (Q' + (qEnd / 3) + ' ' + qY + ')', start: qY + '-' + pad2(qEnd - 2) + '-01', end: dS(new Date(Date.UTC(qY, qEnd, 0))) });
  list.push({ k: 'py', label: 'Full year ' + (Y - 1), start: (Y - 1) + '-01-01', end: (Y - 1) + '-12-31' });
  list.push({ k: 'custom', label: 'Custom range' });
  return list;
}
function findPreset(k) { for (var i = 0; i < S.presets.length; i++) if (S.presets[i].k === k) return S.presets[i]; return null; }

/* ---------------- start up ---------------- */
function init() {
  bindUi();
  setContent('<div class="loading"><h2>Opening the review</h2><p>Checking access and settings.</p></div>');
  call('apiBootstrap', [], onBoot, function (m) { $('bar').classList.add('hide'); setContent(errPanel('This report could not open', m, false)); });
}
function onBoot(b) {
  S.boot = b;
  $('who').textContent = b.user || '';
  $('navSettings').classList.toggle('hide', !b.admin);
  buildPresets();
  readLocation(function (q) {
    q = q || {};
    if (!q.preset && !q.start && b.def) applyQuery(b.def);
    else applyQuery(q);
    syncDefaultBtn();
    if (!b.connected || !b.accounts) {
      if (b.admin) { S.view = 'settings'; render(); return; }
      $('bar').classList.add('hide');
      setContent(errPanel('Not set up yet', 'The report is not connected to Google Ads yet. Ask an admin to finish setup.', false));
      return;
    }
    load(false);
  });
}
function buildPresets() {
  var b = S.boot, keep = $('fPreset').value;
  S.presets = presets(b);
  $('fPreset').innerHTML = S.presets.map(function (p) { return '<option value="' + p.k + '">' + esc(p.label) + '</option>'; }).join('');
  ['fStart', 'fEnd', 'fCmpStart', 'fCmpEnd'].forEach(function (id) { $(id).max = b.today; });
  buildScope();
  setPreset(keep && findPreset(keep) ? keep : 'l12');
}
function sameAsDefault(p) {
  var d = S.boot && S.boot.def;
  if (!d) return p.preset === 'l12' && p.compare === 'yoy' && p.tier === 'all';
  if (d.preset !== p.preset || d.compare !== p.compare || d.tier !== p.tier) return false;
  if (p.preset === 'custom' && (d.start !== p.start || d.end !== p.end)) return false;
  if (p.compare === 'custom' && (d.cmpStart !== p.cmpStart || d.cmpEnd !== p.cmpEnd)) return false;
  return true;
}
function syncDefaultBtn() {
  var b = $('bDefault'); if (!b) return;
  var same = sameAsDefault(params());
  b.disabled = same;
  b.textContent = same ? 'Your default view' : 'Set as default';
  b.title = same ? 'This view opens first every time' : 'Open the report with this period, comparison and scope every time';
}
function saveDefault() {
  var p = params(), bad = checkParams(p);
  if (bad) { flash(bad); return; }
  $('bDefault').textContent = 'Saving...';
  call('apiSaveDefault', [p], function (r) { S.boot.def = r.def; syncDefaultBtn(); }, function (m) { syncDefaultBtn(); flash(m); });
}
function tierName(n) {
  var tn = (S.boot && S.boot.tierNames) || (S.rep && S.rep.meta.tierNames) || [];
  return tn[n - 1] || ('Tier ' + n);
}
function buildScope() {
  var sel = $('fTier'), keep = sel.value;
  var h = '<optgroup label="Tiers"><option value="all">All communities</option>' + [1, 2, 3].map(function (n) { return '<option value="' + n + '">' + esc(tierName(n)) + '</option>'; }).join('') + '</optgroup>';
  if (S.boot.communities && S.boot.communities.length) {
    h += '<optgroup label="One community">' + S.boot.communities.map(function (c) { return '<option value="a' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join('') + '</optgroup>';
  }
  sel.innerHTML = h;
  if (keep && sel.querySelector('option[value="' + keep + '"]')) sel.value = keep;
}
function readLocation(cb) {
  var done = false;
  function fin(q) { if (!done) { done = true; cb(q); } }
  try { google.script.url.getLocation(function (loc) { fin((loc && loc.parameter) || {}); }); } catch (e) { fin({}); }
}
function applyQuery(q) {
  if (q.compare === 'yoy' || q.compare === 'prev' || q.compare === 'custom') $('fCompare').value = q.compare;
  if (/^(all|[123]|a\d{6,})$/.test(q.tier || '') && $('fTier').querySelector('option[value="' + q.tier + '"]')) $('fTier').value = q.tier;
  if (q.preset && findPreset(q.preset) && q.preset !== 'custom') setPreset(q.preset);
  else if (validD(q.start) && validD(q.end)) { setPreset('custom'); $('fStart').value = q.start; $('fEnd').value = q.end; }
  if (validD(q.cmpStart) && validD(q.cmpEnd)) { $('fCmpStart').value = q.cmpStart; $('fCmpEnd').value = q.cmpEnd; }
  syncCustom();
}
function writeLocation(p) {
  var q = { preset: p.preset, compare: p.compare, tier: p.tier };
  if (p.preset === 'custom') { q.start = p.start; q.end = p.end; }
  if (p.compare === 'custom') { q.cmpStart = p.cmpStart; q.cmpEnd = p.cmpEnd; }
  try { google.script.history.replace(null, q, ''); } catch (e) {}
}
function setPreset(k) {
  $('fPreset').value = k;
  var p = findPreset(k);
  if (p && p.start) { $('fStart').value = p.start; $('fEnd').value = p.end; }
  syncCustom();
}
function syncCustom() {
  $('curCustom').classList.toggle('hide', $('fPreset').value !== 'custom');
  var cc = $('fCompare').value === 'custom';
  $('cmpCustom').classList.toggle('hide', !cc);
  if (cc && !$('fCmpStart').value) {
    var st = $('fStart').value, en = $('fEnd').value;
    if (validD(st) && validD(en)) { $('fCmpStart').value = shiftYear(st, -1); $('fCmpEnd').value = shiftYear(en, -1); }
  }
}
function showApply() { $('applyWrap').classList.remove('hide'); }
function params() {
  var k = $('fPreset').value, p = { preset: k, compare: $('fCompare').value, tier: $('fTier').value };
  if (k === 'custom') { p.start = $('fStart').value; p.end = $('fEnd').value; }
  else { var pr = findPreset(k); p.start = pr.start; p.end = pr.end; }
  if (p.compare === 'custom') { p.cmpStart = $('fCmpStart').value; p.cmpEnd = $('fCmpEnd').value; }
  return p;
}
function checkParams(p) {
  if (!validD(p.start) || !validD(p.end)) return 'Pick a start and end date.';
  if (p.start > p.end) return 'The start date is after the end date.';
  if (p.compare === 'custom') {
    if (!validD(p.cmpStart) || !validD(p.cmpEnd)) return 'Pick a start and end date for the comparison.';

  if (S.view !== 'communities') S.view = 'report';

  call('apiGetReport', [q], function (rep) {

/* ---------------- views ---------------- */
function setNav() {
  var map = { report: 'navReport', communities: 'navCommunities', context: 'navContext', ideas: 'navIdeas', settings: 'navSettings' };
  ['navReport', 'navCommunities', 'navContext', 'navIdeas', 'navSettings'].forEach(function (id) { $(id).classList.toggle('on', map[S.view] === id); });
}
function showView(v, sec) {
  if (v === 'settings' && !(S.boot && S.boot.admin)) return;
  if ((v === 'report' || v === 'communities') && (S.stale || (!S.rep && !S.loading)) && S.boot && S.boot.connected && S.boot.accounts) { S.view = v; load(false); return; }
  var changed = S.view !== v;
  S.view = v;
  closeDrawer(true);
  if (changed || v === 'settings' || v === 'context' || v === 'ideas') render(); else setNav();
  if (sec) { var el = $(sec); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' }); }

function render() {
  hideTip();

  el.innerHTML = '<div class="th">' + esc(lines[0]) + '</div>' + lines.slice(1).map(esc).join('<br>');
  el.style.display = 'block';
  var w = el.offsetWidth, h = el.offsetHeight, left = x + 14, top = y + 14;
  if (left + w > window.innerWidth - 8) left = x - w - 14;
  if (top + h > window.innerHeight - 8) top = y - h - 14;
  el.style.left = Math.max(8, left) + 'px';
  el.style.top = Math.max(8, top) + 'px';
}
function hideTip() { var el = $('tip'); if (el) el.style.display = 'none'; }

/* ---------------- communities ---------------- */
function commById(id) { var R = S.rep; if (!R) return null; for (var i = 0; i < R.communities.length; i++) if (R.communities[i].id === id) return R.communities[i]; return null; }
var SORTS = {
  name: function (c) { return c.name.toLowerCase(); }, tier: function (c) { return c.tier; }, status: function (c) { return c.statusLabel; },
  spend: function (c) { return c.cur.spend; }, spendChg: function (c) { return c.chg.spend; },
  conv: function (c) { return c.cur.conv; }, convChg: function (c) { return c.chg.conv; },
  cpa: function (c) { return c.cur.cpa; }, cpaChg: function (c) { return c.chg.cpa; },
  ctr: function (c) { return c.cur.ctr; }, cvr: function (c) { return c.cur.cvr; },
  isB: function (c) { return c.cur.isB; }, isR: function (c) { return c.cur.isR; }
};
function filteredComms() {
  var R = S.rep, q = S.search.trim().toLowerCase();
  var list = R.communities.filter(function (c) {
    return (S.statusFilter === 'all' || c.status === S.statusFilter) && (!q || c.name.toLowerCase().indexOf(q) >= 0);
  });
  var f = SORTS[S.sort.k] || SORTS.spend, d = S.sort.d;
  list.sort(function (x, y) {
    var a = f(x), b = f(y);
    var an = a === null || a === undefined, bn = b === null || b === undefined;
    if (an && bn) return 0; if (an) return 1; if (bn) return -1;
    return (a < b ? -1 : (a > b ? 1 : 0)) * d;
  });
  return list;
}
function commTableHtml() {
  var R = S.rep, list = filteredComms(), cu = esc(R.range.curName);
  function th(k, label, l) { return '<th data-sort="' + k + '" class="' + (l ? 'l ' : '') + (S.sort.k === k ? 'on' : '') + '">' + label + (S.sort.k === k ? (S.sort.d > 0 ? ' \u2191' : ' \u2193') : '') + '</th>'; }
  var h = '<div class="tw"><table class="t" id="commTbl"><thead><tr>' + th('name', 'Community', true) + th('tier', 'Tier') + th('status', 'Status', true) +
    th('spend', 'Spend ' + cu) + th('spendChg', 'Change') + th('conv', 'Conversions') + th('convChg', 'Change') + th('cpa', 'Cost per conv.') + th('cpaChg', 'Change') +
    th('ctr', 'CTR') + th('cvr', 'Conv. rate') + th('isB', 'Lost to budget') + th('isR', 'Lost to rank') + '</tr></thead><tbody>';
  var sp = 0, cv = 0;
  list.forEach(function (c) {
    sp += c.cur.spend; cv += c.cur.conv;
    h += '<tr class="click" data-open="' + esc(c.id) + '"><td class="l"><span class="nm">' + esc(c.name) + '</span>' + (c.note ? '<div class="meta">Has a context note</div>' : '') + '</td>' +
      '<td>' + c.tier + '</td><td class="l">' + esc(c.statusLabel) + '</td><td>' + money(c.cur.spend) + '</td><td>' + chip(c.chg.spend, null) + '</td>' +
      '<td>' + num(c.cur.conv) + '</td><td>' + chip(c.chg.conv, favOf('conv', c.chg.conv)) + '</td><td>' + money(c.cur.cpa) + '</td><td>' + chip(c.chg.cpa, favOf('cpa', c.chg.cpa)) + '</td>' +
      '<td>' + rate(c.cur.ctr) + '</td><td>' + rate(c.cur.cvr) + '</td><td>' + share(c.cur.isB) + '</td><td>' + share(c.cur.isR) + '</td></tr>';
  });
  if (!list.length) h += '<tr><td class="l" colspan="13">No communities match.</td></tr>';
  else h += '</tbody><tfoot><tr><td class="l">' + list.length + (list.length === 1 ? ' community' : ' communities') + '</td><td></td><td></td><td>' + money(sp) + '</td><td></td><td>' + num(cv) + '</td><td></td><td>' + money(cv >= 0.5 ? sp / cv : null) + '</td><td colspan="5"></td></tr></tfoot>';
  return h + (list.length ? '' : '</tbody>') + '</table></div>';
}
function renderCommunities() {
  var R = S.rep, st = R.status;
  var opts = [['all', 'All', R.communities.length], ['improved', 'Improved', st.improved], ['steady', 'Steady', st.steady], ['attention', 'Needs attention', st.attention], ['new', 'New this period', st['new']], ['ended', 'Not running now', st.ended]];
  var h = rangeLine(R) + bannersHtml(R) + '<section class="rep"><div class="eyebrow">Communities</div><h2 class="sec">Every community, side by side</h2>' +

    '<div id="commWrap">' + commTableHtml() + '</div></section>';

function sortBy(k) {
  if (S.sort.k === k) S.sort.d = -S.sort.d; else { S.sort.k = k; S.sort.d = (k === 'name' || k === 'tier' || k === 'status' || k === 'cpa') ? 1 : -1; }

function renderIdeas() {
  setContent('<div class="loading"><h2>Loading the board</h2></div>');
  call('apiGetIdeas', [], function (d) { S.ideas = d; drawIdeas(); }, function (m) { setContent(errPanel('The board could not load', m, false)); });
}
function ideaItem(i, d) {

    '<div class="meta">' + meta.join(' \u00B7 ') + '</div></div>';

    '<div class="field"><label for="iAcct">Community</label><select id="iAcct"><option value="all">All communities</option>' + b.communities.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join('') + '</select></div>' +
    '</div><div class="field" style="margin-top:12px"><label for="iDetail">Detail (optional)</label><input type="text" id="iDetail" maxlength="500" placeholder="What would we run, and what should it do for us?"></div>' +
    '<div class="formrow"><button class="btn solid" type="button" data-act="addIdea">Add to the board</button><span class="status-msg" id="iMsg"></span></div></div>';
  h += '<div class="ideas-grid">';

  document.addEventListener('keydown', function (e) {
    if ($('present').classList.contains('on')) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); goSlide(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goSlide(-1); }
      else if (e.key === 'Home') { S.slideIx = 0; showSlide(); }
      else if (e.key === 'End') { S.slideIx = S.slides.length - 1; showSlide(); }
      else if (e.key === 'Escape') closePresent();
      return;
    }
    if (e.key === 'Escape' && $('drawer').classList.contains('on')) closeDrawer(false);
  });
  window.addEventListener('resize', function () {
    S.charts = S.charts.filter(function (c) { return document.body.contains(c.el); });
    S.charts.forEach(function (c) { var w = c.el.clientWidth; if (w && Math.abs(w - c.w) > 3) drawChart(c); });
    if ($('present').classList.contains('on')) fitStage();
  });
  window.addEventListener('afterprint', afterPrint);
}
init();

</script>
</body>
</html>
