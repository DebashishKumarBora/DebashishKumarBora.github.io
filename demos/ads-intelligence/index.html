<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ads Intelligence | Vertex demo</title>
<style>
/* ===================== Vertex Ads Intelligence ===================== */
:root{
  --bg:#FFFFFF; --side:#F7F7F6; --panel:#FFFFFF; --soft:#F4F4F3; --soft2:#ECECEA;
  --ink:#141414; --ink2:#3E4041; --mute:#636566; --line:#E4E4E2; --line2:#CBCCCB;
  --black:#000000; --white:#FFFFFF; --gray:#A8AAAB; --gold:#CDA176; --on:#000000; --onText:#FFFFFF; --heat:0,0,0;
  --serif:"Adobe Garamond Pro","EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  --sans:Calibri,Carlito,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0D0D0D; --side:#141414; --panel:#141414; --soft:#1B1B1C; --soft2:#262728; --ink:#ECECEC; --ink2:#C9CBCC; --mute:#A3A5A6; --line:#262728; --line2:#3A3B3C;
    --black:#F2F2F2; --white:#0D0D0D; --on:#F2F2F2; --onText:#0D0D0D; --heat:255,255,255; color-scheme:dark; }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
b,strong,h1,h2,h3,h4,th{font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
.caps{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.serif{font-family:var(--serif)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none !important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wm{font-family:var(--serif);letter-spacing:.42em;font-size:17px;padding-left:.42em;line-height:1}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:22px 20px 16px;display:flex;flex-direction:column;gap:8px}
.brand .caps{letter-spacing:.2em}
.newchat{margin:4px 14px 10px;display:flex;align-items:center;gap:10px;justify-content:flex-start;padding:10px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);min-height:42px}
.newchat:hover{border-color:var(--black)}
.nav{display:flex;flex-direction:column;padding:2px 10px 8px}
.nav button{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;text-align:left;color:var(--ink2);min-height:40px}
.nav button:hover{background:var(--soft2)}
.nav button.on{background:var(--soft2);color:var(--ink)}
.recents{flex:1;overflow-y:auto;padding:6px 10px 10px;min-height:0}
.recents .caps{padding:10px 12px 6px}
.rc{display:flex;align-items:center;border-radius:8px}
.rc button.t{flex:1;min-width:0;text-align:left;padding:8px 12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;min-height:36px}
.rc button.x{width:32px;height:32px;color:var(--mute);opacity:0;display:flex;align-items:center;justify-content:center}
.rc:hover{background:var(--soft2)} .rc:hover button.x{opacity:1}
.rc.on{background:var(--soft2)} .rc.on button.t{color:var(--ink)}
.who{border-top:1px solid var(--line);padding:12px 18px 14px;font-size:12.5px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.who .st{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gray);display:inline-block}
.dot.ok{background:var(--gold)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.mtop{display:none}
.scrim{display:none}

/* ---------- chat ---------- */
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.thread{flex:1;overflow-y:auto;min-height:0}
.col{max-width:800px;margin:0 auto;padding:0 28px}
.hello{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;padding:40px 0 60px}
.hello h1{font-family:var(--serif);font-size:42px;line-height:1.1;text-align:center}
.hello .sub{text-align:center;color:var(--mute);margin:10px 0 28px}
.hello .rule{width:44px;height:1px;background:var(--gold);margin:18px auto 0}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.sugg button{text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink2);font-size:14px;line-height:1.45;min-height:64px}
.sugg button:hover{border-color:var(--line2);background:var(--soft)}
.sugg button .caps{display:block;margin-bottom:4px}
.composer{border:1px solid var(--line2);border-radius:12px;background:var(--panel);padding:12px 12px 10px 16px;position:relative}
.composer:focus-within{border-color:var(--black)}
.composer textarea{width:100%;border:0;outline:none;resize:none;background:transparent;min-height:26px;max-height:220px;line-height:1.5;font-size:15.5px;display:block}
.composer .row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink2);min-height:32px;max-width:100%}
.chip:hover{border-color:var(--line2)}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.send{margin-left:auto;width:38px;height:38px;border-radius:9px;background:var(--on);color:var(--onText);display:flex;align-items:center;justify-content:center}
.send:disabled{opacity:.35;cursor:default}
.send svg{width:18px;height:18px}
.hint{font-size:12px;color:var(--mute);text-align:center;margin:8px 0 14px}
.dock{padding:10px 0 4px;background:var(--bg)}
.pop{position:absolute;z-index:40;background:var(--panel);border:1px solid var(--line2);border-radius:10px;width:300px;max-width:calc(100vw - 32px);padding:8px;display:flex;flex-direction:column;max-height:360px}
.pop input{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--bg);outline:none;margin-bottom:6px}
.pop .ls{overflow-y:auto;flex:1}
.pop label,.pop .opt{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:7px;cursor:pointer;font-size:14px;min-height:38px;width:100%;text-align:left}
.pop label:hover,.pop .opt:hover,.pop .opt.on{background:var(--soft)}
.pop .ft{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--on);flex:0 0 auto}

.msg{padding:18px 0}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.bubble{background:var(--soft);border-radius:12px;padding:11px 15px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.ctxl{margin-top:6px;font-size:12px;color:var(--mute)}
.msg.ai{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px}
.av{width:28px;height:28px;border-radius:7px;background:var(--on);color:var(--onText);font-family:var(--serif);font-size:16px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.steps{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.steps .hd{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;text-align:left;font-size:14px;color:var(--ink2);min-height:42px}
.steps .hd .r{margin-left:auto;color:var(--mute);font-size:12.5px}
.steps .bd{border-top:1px solid var(--line);padding:6px 0}
.st{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 14px;font-size:13.5px}
.st .lb{color:var(--ink2)}
.st .sm{color:var(--mute);font-size:12.5px;white-space:nowrap}
.st.note{grid-template-columns:22px minmax(0,1fr)}
.st.note .lb{color:var(--mute);font-style:italic}
.st .qy{grid-column:2 / -1;font-family:var(--mono);font-size:11.5px;background:var(--soft);border-radius:6px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink2);margin-top:4px}
.st .err{grid-column:2 / -1;color:var(--ink2);font-size:12.5px;border-left:2px solid var(--gold);padding-left:8px;margin-top:2px}
.st button.sq{font-size:12px;color:var(--mute);text-decoration:underline;padding:0 0 0 6px}
.ic{width:18px;height:18px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.spin{width:14px;height:14px;border:1.6px solid var(--line2);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ok svg,.bad svg{width:15px;height:15px}
.answer{color:var(--ink);overflow-wrap:anywhere}
.answer p{margin:0 0 12px}
.answer h2{font-family:var(--serif);font-size:24px;line-height:1.2;margin:22px 0 10px}
.answer h3{font-family:var(--serif);font-size:19px;margin:18px 0 8px}
.answer h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
.answer ul,.answer ol{margin:0 0 12px 22px}
.answer li{margin:3px 0}
.answer strong{color:var(--black)}
.answer em{font-style:italic}
.answer code{font-family:var(--mono);font-size:12.5px;background:var(--soft);padding:1px 5px;border-radius:4px}
.answer pre{background:var(--soft);border-radius:8px;padding:12px;overflow-x:auto;margin:0 0 12px;font-family:var(--mono);font-size:12.5px}
.answer blockquote{border-left:2px solid var(--gold);padding-left:12px;color:var(--ink2);margin:0 0 12px}
.answer hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.answer a{text-decoration:underline;text-underline-offset:2px}
.answer a.btn{text-decoration:none}
.acts{display:flex;gap:4px;margin-top:6px}
.acts button{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;color:var(--mute);font-size:12.5px;min-height:32px}
.acts button:hover{background:var(--soft);color:var(--ink)}
.oops{border:1px solid var(--line2);border-left:2px solid var(--gold);border-radius:8px;padding:12px 14px;margin-top:6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.oops .btn{margin-left:auto}

/* ---------- widgets inside answers ---------- */
.wd{border:1px solid var(--line);border-radius:10px;margin:6px 0 16px;overflow:hidden;background:var(--panel)}
.wd .wh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px 8px;flex-wrap:wrap}
.wd .wt{font-family:var(--serif);font-size:17px;line-height:1.25}
.wd .ws{font-size:12px;color:var(--mute)}
.wd .wf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.wd .wf button{color:var(--mute);text-decoration:underline;text-underline-offset:2px;font-size:12.5px;min-height:28px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:8px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none;background:var(--panel)}
table.t th.r,table.t td.r{text-align:right}
table.t td.r{white-space:nowrap}
.bodyc{min-width:0}
table.t td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t td.tx{max-width:360px;min-width:110px;overflow-wrap:break-word}
table.t tfoot td{border-top:1px solid var(--line2);color:var(--ink)}
table.t th .ar{color:var(--gold);margin-left:4px}
.chg{white-space:nowrap}
.cv{padding:6px 14px 10px;position:relative}
.cv svg{display:block;width:100%;height:220px;overflow:visible}
.cv .tip{position:absolute;pointer-events:none;background:var(--on);color:var(--onText);border-radius:7px;padding:7px 10px;font-size:12.5px;line-height:1.4;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5}
.cv .tip.on{opacity:1}
.cv .lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:6px}
.cv .lg i{display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle}
.hb{display:grid;grid-template-columns:minmax(90px,34%) minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:4px 0;font-size:13.5px}
.hb .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hb .b{height:10px;background:var(--soft2);border-radius:3px;overflow:hidden}
.hb .b i{display:block;height:100%;background:var(--on);border-radius:3px}
.hb .v{font-variant-numeric:tabular-nums;color:var(--ink)}
.fx{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px}
.fc{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--panel)}
.fc .top{display:flex;align-items:flex-start;gap:10px}
.fc .tt{font-size:15px;color:var(--ink);line-height:1.4}
.fc .wy{color:var(--ink2);font-size:14px;margin-top:4px}
.fc .bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-flex;align-items:center;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap;flex:0 0 auto;margin-top:1px}
.tag.critical{background:var(--on);border-color:var(--on);color:var(--onText)}
.tag.high{border-color:var(--black);color:var(--black)}
.tag.medium{border-color:var(--line2)}
.tag.low{background:var(--soft);border-color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border:1px solid var(--line2);border-radius:8px;font-size:13.5px;color:var(--ink);background:var(--panel);min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--black)}
a.btn{text-decoration:none}
.btn.dark{background:var(--on);color:var(--onText);border-color:var(--on)}
.btn.dark:hover{opacity:.88}
.btn.sm{padding:5px 10px;min-height:32px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- pages ---------- */
.page{flex:1;overflow-y:auto;min-height:0}
.wrap{max-width:1180px;margin:0 auto;padding:30px 32px 60px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-family:var(--serif);font-size:34px;line-height:1.1}
.ph p{color:var(--mute);margin-top:6px;max-width:680px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:18px 20px;margin-bottom:16px}
.card h3{font-family:var(--serif);font-size:20px;margin-bottom:4px}
.card .d{color:var(--mute);font-size:13.5px;margin-bottom:14px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.f label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.in,.f input,.f select,.f textarea,select.in{width:100%;border:1px solid var(--line2);border-radius:8px;background:var(--bg);padding:9px 11px;outline:none;min-height:40px}
.in:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--black)}
.f .h{font-size:12px;color:var(--mute);margin-top:5px;line-height:1.45}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.bar .fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.bar .fld>span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pick{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;min-height:40px;background:var(--bg);min-width:170px;max-width:260px;text-align:left}
.pick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--soft);border-radius:10px;padding:12px 14px;min-width:0}
.k .v{font-family:var(--serif);font-size:26px;line-height:1.15;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .c{font-size:12px;color:var(--mute);margin-top:2px}
.qs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.empty{color:var(--mute);padding:26px 4px;text-align:center}
.pg{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}

/* audit */
.sum{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:10px;margin-bottom:16px}
.sum .k .v{font-size:30px}
.ring{width:54px;height:54px;flex:0 0 54px}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--soft2)}
.ring .fgc{stroke:var(--on);stroke-linecap:round}
.health{display:flex;align-items:center;gap:14px}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;margin-bottom:18px}
.ac{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;background:var(--panel);min-width:0;min-height:70px}
.ac:hover{border-color:var(--line2)}
.ac.on{border-color:var(--black)}
.ac .ring{width:44px;height:44px;flex-basis:44px;position:relative}
.ac .n{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac .s{font-size:12px;color:var(--mute)}
.rv{position:relative;display:inline-flex;align-items:center;justify-content:center}
.rv b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:15px}
.health .rv b{font-size:18px}
.fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;border:1px solid var(--line2);border-radius:8px}
.seg button{flex:0 0 auto;white-space:nowrap}
.seg button{padding:7px 12px;font-size:13px;color:var(--ink2);min-height:36px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--on);color:var(--onText)}
.fd{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
.fd .row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px;width:100%;text-align:left;min-height:52px}
.fd .row .tt{color:var(--ink);line-height:1.35}
.fd .row .sub{font-size:12.5px;color:var(--mute);margin-top:2px}
.fd .row .imp{font-family:var(--serif);font-size:17px;white-space:nowrap}
.fd .row .chev{color:var(--mute);transition:transform .2s}
.fd.open .row .chev{transform:rotate(90deg)}
.fd .body{border-top:1px solid var(--line);padding:12px 14px 14px}
.fd .body p{color:var(--ink2);margin-bottom:10px;max-width:820px}
.fd .body .lab{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.fd.dim{opacity:.55}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:var(--on);color:var(--onText);padding:11px 18px;border-radius:9px;font-size:14px;z-index:90;transition:transform .25s;max-width:90vw;visibility:hidden}
.toast.on{transform:translate(-50%,0);visibility:visible}
.notice{border:1px solid var(--line2);border-left:2px solid var(--gold);border-radius:10px;padding:16px 18px;margin:20px 0;background:var(--panel)}
.notice h3{font-family:var(--serif);font-size:20px;margin-bottom:4px}
.notice p{color:var(--ink2)}
.boot{height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:var(--mute)}

/* ---------- date range picker ---------- */
.drp{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line2);border-radius:12px;display:grid;grid-template-columns:170px auto;overflow:hidden;max-width:calc(100vw - 24px)}
.drp .pre{border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px;background:var(--side)}
.drp .pre button{text-align:left;padding:8px 10px;border-radius:7px;font-size:13.5px;color:var(--ink2);min-height:36px}
.drp .pre button:hover{background:var(--soft2)} .drp .pre button.on{background:var(--on);color:var(--onText)}
.drp .cal{padding:12px 14px 10px}
.drp .ms{display:flex;gap:22px}
.drp .mo{width:238px}
.drp .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;min-height:32px}
.drp .mh .t{font-family:var(--serif);font-size:17px}
.drp .mh button{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.drp .mh button:hover{background:var(--soft)}
.drp .wk,.drp .dg{display:grid;grid-template-columns:repeat(7,34px);gap:0}
.drp .wk span{font-size:10.5px;letter-spacing:.1em;color:var(--mute);text-align:center;padding:4px 0}
.drp .dg button{width:100%;height:34px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;border-radius:0}
.drp .dg button:hover:not(:disabled){outline:1px solid var(--ink);outline-offset:-1px;border-radius:7px}
.drp .dg button.in{background:var(--soft2)}
.drp .dg button.s,.drp .dg button.e{background:var(--on);color:var(--onText);border-radius:7px}
.drp .dg button:disabled{color:var(--line2);cursor:default}
.drp .dg button.td{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gold)}
.drp .ft{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.drp .ft .rng{font-size:13.5px;color:var(--ink2);margin-right:auto}
.drp .ft select{width:auto;max-width:100%;border:1px solid var(--line2);border-radius:8px;padding:6px 8px;background:var(--bg);min-height:34px}

/* ---------- modal ---------- */
.mdl{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;padding:20px}
.mdl .box{background:var(--panel);border-radius:14px;width:560px;max-width:100%;max-height:calc(100vh - 40px);display:flex;flex-direction:column;border:1px solid var(--line2)}
.mdl .box.wide{width:820px}
.mdl .mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 8px}
.mdl .mh h2{font-family:var(--serif);font-size:24px;line-height:1.2}
.mdl .mh button{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.mdl .mh button:hover{background:var(--soft)}
.mdl .mb{padding:6px 20px 14px;overflow-y:auto}
.mdl .mb p.d{color:var(--mute);font-size:13.5px;margin-bottom:12px}
.mdl .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.mdl label.l{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:12px 0 5px}
.mdl textarea.in{min-height:220px;line-height:1.5;resize:vertical}
.mdl pre.doc{white-space:pre-wrap;font-family:var(--sans);font-size:13.5px;line-height:1.55;color:var(--ink2);background:var(--soft);border-radius:8px;padding:12px}
.opt2{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt2.on{border-color:var(--ink)}
.opt2 .t{color:var(--ink)} .opt2 .s{font-size:12.5px;color:var(--mute)}
.ppl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ppl .e{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppl select{border:1px solid var(--line2);border-radius:7px;padding:5px 6px;background:var(--bg)}

/* ---------- projects ---------- */
.pjg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pj{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:138px}
.pj:hover{border-color:var(--line2);background:var(--soft)}
.pj .n{font-family:var(--serif);font-size:20px;line-height:1.2;color:var(--ink)}
.pj .ds{color:var(--ink2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pj .mt{margin-top:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);flex-wrap:wrap}
.pjw{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.pjw .aside .card{padding:16px 16px}
.pjw .aside h3{font-family:var(--serif);font-size:18px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pjw .aside .tx{color:var(--ink2);font-size:13.5px;white-space:pre-wrap;max-height:150px;overflow:hidden;position:relative}
.cap{height:4px;background:var(--soft2);border-radius:2px;overflow:hidden;margin:8px 0 4px}
.cap i{display:block;height:100%;background:var(--on)}
.kn{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.kn .ki{width:34px;height:40px;border:1px solid var(--line2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9.5px;letter-spacing:.08em;color:var(--mute);flex:0 0 34px;text-transform:uppercase}
.kn .kt{flex:1;min-width:0}
.kn .kt button{display:block;max-width:100%;text-align:left;color:var(--ink);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kn .kt span{font-size:11.5px;color:var(--mute)}
.kn .x{width:30px;height:30px;border-radius:7px;color:var(--mute);display:flex;align-items:center;justify-content:center}
.kn .x:hover{background:var(--soft)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mute);padding:14px 0 0;min-width:0}
.crumb button{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.crumb .ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb .mn{margin-left:auto;flex:0 0 auto}
.cl{display:flex;flex-direction:column}
.cl > button{display:flex;justify-content:space-between;gap:12px;padding:12px 4px;border-top:1px solid var(--line);text-align:left;color:var(--ink)}
.cl > button:hover{background:var(--soft)}
.cl > button span:last-child{color:var(--mute);font-size:12.5px;white-space:nowrap}
.rc .pn{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- tools gallery ---------- */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:26px}
.tc{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:10px;min-height:178px;position:relative}
.tc:hover{border-color:var(--ink)}
.tc .ti{width:40px;height:40px;border-radius:10px;background:var(--on);color:var(--onText);display:flex;align-items:center;justify-content:center}
.tc .ti svg{width:20px;height:20px}
.tc .tn{font-family:var(--serif);font-size:21px;line-height:1.15;color:var(--ink)}
.tc .td{font-size:13.5px;color:var(--ink2);line-height:1.5}
.tc .tf{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.tc .tf .go{color:var(--ink);display:flex;align-items:center;gap:4px}
.sec{display:flex;align-items:baseline;gap:12px;margin:6px 0 10px}
.sec h2{font-family:var(--serif);font-size:22px}
.sec .ln{flex:1;height:1px;background:var(--line)}
.tw2{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.tp{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;border-radius:12px}
.tp .card{padding:16px}
.tp .fl2{margin-bottom:12px}
.tp .fl2>label,.tp .fl2>.lab{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.tp .fl2 .h{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.4}
.tp textarea.in{min-height:84px;resize:vertical;line-height:1.45}
.tp .pick{width:100%;max-width:none}
.tp .seg{display:flex;width:100%}
.tp .seg button{flex:1 1 0}
.tw2.wide{grid-template-columns:minmax(0,1fr)}
.tw2.wide .tp{position:static;max-height:none;overflow:visible}
.tw2.wide #tpanel{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-start}
.tw2.wide .fl2{margin:0;flex:0 1 280px;min-width:220px}
.tw2.wide .fl2{position:relative}
.tw2.wide .fl2 .mlist{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:4px !important;background:var(--panel);max-height:300px}
.tw2.wide #tpanel>button{width:auto !important;margin:19px 0 0 !important;min-height:40px}
.mlist{border:1px solid var(--line2);border-radius:8px;max-height:220px;overflow-y:auto;padding:4px}
.mlist label{display:flex;gap:8px;align-items:center;padding:6px 6px;border-radius:6px;font-size:13.5px;cursor:pointer}
.mlist label:hover{background:var(--soft)}
.tempty{border:1px dashed var(--line2);border-radius:14px;padding:44px 24px;text-align:center;color:var(--mute)}
.tempty .serif{font-size:22px;color:var(--ink);display:block;margin-bottom:6px}
.busy{display:flex;align-items:center;gap:12px;padding:28px;border:1px solid var(--line);border-radius:14px;color:var(--ink2);background:var(--panel)}
.tk{border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:10px;padding:14px 16px;margin-bottom:14px;background:var(--panel)}
.tk .hl{font-family:var(--serif);font-size:19px;line-height:1.3;margin-bottom:6px}
.tk p,.tk li{color:var(--ink2)} .tk ul{margin:6px 0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ch{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.ch.block{background:var(--on);border-color:var(--on);color:var(--onText)}
.ch.warn{border-color:var(--gold);color:var(--ink)}
.ch.info{background:var(--soft);border-color:var(--soft);color:var(--mute)}
.ch.ok{border-color:var(--line);color:var(--mute)}

/* ---------- ad copy ---------- */
.serp{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#FFFFFF;color:#202124;font-family:Arial,Helvetica,sans-serif;max-width:640px}
.serp.mob{max-width:400px;border-radius:18px}
.serp .sp{font-size:12px;font-weight:700;color:#202124;margin-bottom:4px}
.serp .du{display:flex;align-items:center;gap:8px;font-size:13px;color:#202124;margin-bottom:4px}
.serp .du i{width:26px;height:26px;border-radius:50%;background:#F1F3F4;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#5f6368}
.serp .du small{display:block;font-size:12px;color:#4d5156}
.serp .hd{font-size:20px;line-height:1.3;color:#1a0dab;margin:2px 0 4px}
.serp.mob .hd{font-size:18px}
.serp .ds{font-size:14px;line-height:1.58;color:#4d5156}
.acw{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.lines{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.lines .lh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.lines .lh .wt{font-family:var(--serif);font-size:17px}
.ln2{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px 10px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:center}
.ln2:last-child{border-bottom:0}
.ln2 .ix{font-size:12px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.ln2 input.tx{width:100%;border:1px solid transparent;border-radius:7px;padding:7px 9px;background:var(--soft);outline:none;font-size:14.5px;color:var(--ink)}
.ln2 input.tx:focus{border-color:var(--ink);background:var(--bg)}
.ln2 .rt{display:flex;align-items:center;gap:6px}
.ln2 .cnt{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.ln2 .cnt.over{color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px}
.ln2 select{border:1px solid var(--line);border-radius:7px;padding:4px 4px;background:var(--bg);font-size:12px;color:var(--ink2);min-height:30px}
.ln2 .ib{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.ln2 .ib:hover{background:var(--soft);color:var(--ink)}
.ln2 .sub2{grid-column:2 / -1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute)}
.alts{grid-column:2 / -1;display:flex;flex-direction:column;gap:4px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.alts button{text-align:left;padding:6px 8px;border-radius:6px;font-size:13.5px}
.alts button:hover{background:var(--panel)}
.alts button span{color:var(--mute);font-size:12px;margin-left:8px}
.ready{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px 16px;font-size:13px;color:var(--ink2)}
.ready span{display:flex;gap:8px;align-items:center}
.ready svg{width:16px;height:16px}
.ready .no{color:var(--mute)}
.ready .no svg{color:var(--gold)}

/* ---------- other tool results ---------- */
.wf2 svg{display:block;width:100%;height:240px}
.bul{position:relative;height:12px;background:var(--soft2);border-radius:3px;min-width:120px}
.bul i{position:absolute;left:0;top:0;bottom:0;background:var(--on);border-radius:3px}
.bul b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold)}
.bul u{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--mute)}
.heat td.hc{cursor:pointer;text-align:right;white-space:nowrap}
.heat td.hc:hover{outline:1px solid var(--ink);outline-offset:-1px}
.heat td.hc small{display:block;font-size:11px;color:var(--mute)}
.contrib{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.contrib .bb{width:90px;height:8px;position:relative;background:var(--soft2);border-radius:2px}
.contrib .bb i{position:absolute;top:0;bottom:0;background:var(--on)}
.contrib .bb i.neg{background:var(--gray)}
.contrib .bb:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--mute)}
.recap{white-space:pre-wrap}
textarea.recap{width:100%;min-height:300px;border:1px solid var(--line2);border-radius:10px;padding:14px;background:var(--bg);line-height:1.6;font-size:14.5px;resize:vertical}
.cbx{width:16px;height:16px;accent-color:var(--on)}

/* ---------- numbers sit level everywhere ---------- */
html{font-variant-numeric:lining-nums}
.num,.k .v,.rv b,table.t td,.hb .v,.serif,.fd .row .imp,.bul+span,.cnt{font-variant-numeric:lining-nums tabular-nums}
.dl{display:inline-flex;align-items:center;gap:3px;font-family:var(--sans);font-size:12px;line-height:1.45;padding:0 7px;border-radius:999px;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums;border:1px solid transparent;vertical-align:middle}
.dl i{font-style:normal;font-size:8px;line-height:1}
.dl.good{background:var(--soft2);color:var(--ink)}
.dl.bad{border-color:var(--gold);color:var(--ink)}
.dl.flat{color:var(--mute);padding:0 2px}
.k .c{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
td .dl{font-size:11.5px}

/* ---------- composer extras ---------- */
.composer.drag{border-color:var(--ink);border-style:dashed;background:var(--soft)}
.atts{display:flex;flex-wrap:wrap;gap:8px}
.atts:not(:empty){margin-bottom:10px}
.att{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:5px 6px 5px 5px;max-width:250px;background:var(--panel)}
.att img{width:40px;height:40px;object-fit:cover;border-radius:7px;flex:0 0 40px}
.att .ai{width:40px;height:40px;border-radius:7px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:0 0 40px;color:var(--ink2)}
.att .an{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.att .an b{font-weight:400;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .an span{font-size:11.5px;color:var(--mute)}
.att button{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mute);flex:0 0 26px}
.att button:hover{background:var(--soft);color:var(--ink)}
.att.err{border-color:var(--gold)}
.att.sm{max-width:220px}
.cib{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.cib:hover{background:var(--soft)}
.chip.deep.on{background:var(--on);color:var(--onText);border-color:var(--on)}
.pop.slash{width:340px}
.pop.slash .opt{gap:10px}
.pop.slash .si{width:30px;height:30px;border-radius:7px;background:var(--on);color:var(--onText);display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.pop.slash .si svg{width:16px;height:16px}
.pop.slash .st2{display:block;color:var(--ink)} .pop.slash .sd{display:block;font-size:12px;color:var(--mute)}

/* ---------- messages extras ---------- */
.ufiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-bottom:8px;max-width:85%}
.uimg img{display:block;max-width:180px;max-height:140px;border-radius:10px;border:1px solid var(--line)}
.uacts{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:26px}
.uacts .ctxl{margin:0}
.uacts button{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);padding:3px 6px;border-radius:6px;opacity:0;transition:opacity .15s}
.uacts button svg{width:14px;height:14px}
.msg.user:hover .uacts button,.uacts button:focus-visible{opacity:1}
.bubble.edit{width:85%;max-width:640px;background:var(--panel);border:1px solid var(--ink);padding:10px}
.bubble.edit textarea{min-height:90px;resize:vertical;border:0;padding:4px;background:transparent}
.acts .sp{flex:1}
.acts button.th{padding:6px;min-width:32px;justify-content:center}
.acts button.th.on{color:var(--ink);background:var(--soft2)}
.nexts{display:flex;flex-direction:column;gap:0;margin:14px 0 2px;border-top:1px solid var(--line)}
.nexts button{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--ink2);font-size:14px}
.nexts button:hover{color:var(--ink);background:var(--soft)}
.nexts button svg{width:14px;height:14px;color:var(--gold);flex:0 0 14px}
.seg.sm button{padding:3px 9px;font-size:12px;min-height:28px}
.cvsw{margin-left:auto}

/* ---------- sidebar extras ---------- */
.rs{display:flex;align-items:center;gap:6px;margin:4px 2px 6px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:36px}
.rs .ic{color:var(--mute);width:16px;height:16px}
.rs input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:13.5px;padding:7px 0}
.rc{position:relative}
.rc.mo{background:var(--soft2)} .rc.mo button.x{opacity:1}
.rcm{position:absolute;right:4px;top:calc(100% - 2px);z-index:20;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:4px;width:210px;display:flex;flex-direction:column}
.rcm button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;font-size:13.5px;text-align:left;color:var(--ink2)}
.rcm button:hover{background:var(--soft);color:var(--ink)}
.rcm button svg{width:16px;height:16px}
button.who{text-align:left;width:100%}
button.who:hover{background:var(--soft2)}
.who .wr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.who .wr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .wr svg{width:15px;height:15px;flex:0 0 15px}
@media (hover:none){ .rc button.x{opacity:1} .uacts button{opacity:1} }

/* ---------- daily brief ---------- */
.brief{margin:18px 0 4px}
.brief .bh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.brief .lnk{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2)}
.brief .lnk svg{width:14px;height:14px}
.brief .bc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

function downloadCsv(name, rows){
  var csv = rows.map(function(r){ return r.map(function(v){ v = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
  try {
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast('Downloaded ' + name + '.');
  } catch (e) { copyText(csv, 'Your browser blocked the download, so the file was copied instead. Paste it into a sheet and save as CSV.'); }
  window.__lastCsv = { name: name, csv: csv };
}

/* photos are scaled to at most 1568 pixels, which is what Claude reads best */
function readImage(file, a, done, fail){
  var r = new FileReader();
  r.onload = function(){
    var img = new Image();
    img.onload = function(){
      try {
        var max = 1568, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
        var cx = cv.getContext('2d'); cx.fillStyle = '#FFFFFF'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
        var png = file.type === 'image/png' && k === 1 && file.size < 1500000;
        a.data = png ? String(r.result) : cv.toDataURL('image/jpeg', 0.86); a.mime = png ? 'image/png' : 'image/jpeg';
        var t = Math.min(1, 160 / Math.max(cv.width, cv.height)), tc = document.createElement('canvas'); tc.width = Math.max(1, Math.round(cv.width * t)); tc.height = Math.max(1, Math.round(cv.height * t));
        tc.getContext('2d').drawImage(cv, 0, 0, tc.width, tc.height); a.thumb = tc.toDataURL('image/jpeg', 0.75);
        a.size = Math.round(a.data.length * 0.75);

    };
    img.onerror = function(){ fail('Could not read the image'); };
    img.src = String(r.result);
  };
  r.onerror = function(){ fail('Could not read it'); };
  r.readAsDataURL(file);
}

  authCall('apiAuthVerify', { email: a.email, code: c, ua: deviceName() }).then(function(r){ if (!r || r.error) return auFail(r); auDone(r); }, auFail);
};
ACT.auResend = function(){ var a = authState(); authCall('apiAuthResend', { email: a.email }).then(function(r){ if (!r || r.error) return auFail(r); a.err = ''; a.note = 'A new code is on its way. Use the newest one.'; renderLogin(); }, auFail); };
ACT.auBack = function(){ var a = authState(); S.auth = { step: 'start', name: a.name, email: a.email }; renderLogin(); };
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' || !e.target || !e.target.closest || !e.target.closest('.acard')) return;
  var b = document.querySelector('.acard .btn.dark'); if (b && !b.disabled){ e.preventDefault(); b.click(); }
});
ACT.signOut = function(){ var t = TOKEN; closeModal(); authCall('apiAuthLogout', t).then(function(){}, function(){}); saveToken(''); S.auth = { step: 'start', note: 'You are signed out.' }; S.view = ''; S.chat = null; S.chats = []; renderLogin(); };

/* ===================== Admin page (owner only) ===================== */
function loadPeople(){ call('apiPeople').then(function(r){ if (r && r.ok){ S.people = r; if (S.view === 'admin') renderPeople(); } else if (r && r.denied) toast('Only the owner can open this page.'); }); }
var ROLE = { owner: 'Owner', admin: 'Admin', user: 'User', domain: 'By domain' };
function renderPeople(){
  var el = $('view'), p = S.people;
  var h = '<div class="wrap"><div class="ph"><div><h1>Admin</h1><p>Only you can see this page. Set the team code, choose who can sign in and see who signed in and when.</p></div></div>';
  if (!p){ el.innerHTML = h + '<div class="busy"><span class="spin"></span>Loading</div></div>'; return; }
  var t = p.team || {};
  h += '<div class="card"><h3>Team code</h3><div class="d">Everyone types this code when they sign in, along with their name and work email. Then the app emails them a 6 digit code. Share it only with your team.</div>'
    + (t.code ? '<div class="tcode"><span class="l">Current code</span><span class="v" id="tcVal" data-code="' + esc(t.code) + '">\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022</span><button class="btn sm" data-act="tcShow">Show</button><button class="btn sm" data-act="tcCopy">' + ic('copy') + 'Copy</button><span class="em">Changed ' + esc(ago(t.at)) + '</span></div>'
      : '<div class="anote" role="status">No team code yet, so only you can sign in. Set one below and share it with your team.</div>')
    + '<div class="bar" style="flex-wrap:nowrap;margin-top:12px"><input class="in" id="tcNew" placeholder="' + (t.code ? 'New team code' : 'Choose a team code') + '" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="New team code"><button class="btn dark" data-act="tcSave">' + (t.code ? 'Change code' : 'Set code') + '</button></div>'
    + '<label class="chk"><input type="checkbox" id="tcOut"' + (t.code ? '' : ' disabled') + '> Also sign everyone else out, so they sign in again with the new code</label>'
    + '<div class="h">At least 6 characters. Capital letters and spaces do not matter.</div></div>';
  h += '<div class="card"><h3>People</h3><div class="d">Anyone with an email at the domains below can sign in with the team code. Add people from other emails here, make someone an Admin so they can change Settings, or remove access.</div>'
    + '<div class="bar" style="margin-bottom:12px;flex-wrap:nowrap"><input class="in" id="ppEmail" placeholder="name@vertex.example" aria-label="Email to add"><select class="in" id="ppRole" style="width:auto" aria-label="Role"><option value="user">User</option><option value="admin">Admin, can change Settings</option></select><button class="btn dark" data-act="ppAdd">Add</button></div>'
    + '<div class="tw"><table class="t ppl2"><thead><tr><th style="cursor:default">Person</th><th style="cursor:default">Role</th><th style="cursor:default">Last sign in</th><th style="cursor:default">Devices</th><th style="cursor:default"></th></tr></thead><tbody>'
    + p.people.map(function(x){
      var me = x.email === p.owner, st = x.removed ? ' <span class="ch">Access removed</span>' : (x.locked ? ' <span class="ch warn">Locked</span>' : '');
      return '<tr' + (x.removed ? ' class="off"' : '') + '><td class="tx"><div>' + esc(x.name || 'Not signed in yet') + st + '</div><div class="em">' + esc(x.email) + '</div></td>'
        + '<td class="tx">' + (me || x.role === 'domain' || x.removed ? esc(ROLE[x.role] || '') : '<select data-on="ppRole" data-arg="' + esc(x.email) + '" aria-label="Role"><option value="user">User</option><option value="admin"' + (x.role === 'admin' ? ' selected' : '') + '>Admin</option></select>') + '</td>'
        + '<td class="tx">' + (x.last ? esc(ago(x.last)) : '<span style="color:var(--mute)">Never</span>') + '</td>'
        + '<td class="tx">' + (x.devices ? '<span title="' + esc(x.sessions.map(function(s){ return s.ua || 'Device'; }).join(', ')) + '">' + x.devices + '</span>' : '0') + '</td>'
        + '<td class="tx"><div class="pact">' + (x.removed ? '<button class="btn sm" data-act="ppRestore" data-arg="' + esc(x.email) + '">Restore</button>'
          : (x.locked ? '<button class="btn sm" data-act="ppUnlock" data-arg="' + esc(x.email) + '">Unlock</button>' : '') + (x.devices && !me ? '<button class="btn sm" data-act="ppOut" data-arg="' + esc(x.email) + '">Sign out</button>' : '') + (!me ? '<button class="btn sm" data-act="ppRemove" data-arg="' + esc(x.email) + '">Remove</button>' : '')) + '</div></td></tr>';
    }).join('') + '</tbody></table></div></div>';
  h += '<div class="card"><h3>Email domains</h3><div class="d">Anyone with an email at these domains can sign in with the team code and the email code. Leave it empty to allow only the people above.</div><div class="bar" style="flex-wrap:nowrap"><input class="in" id="ppDom" value="' + esc(p.domains.join(', ')) + '" placeholder="vertex.example" aria-label="Domains"><button class="btn" data-act="ppDomSave">Save</button></div></div>';
  h += '<div class="card"><h3>Devices</h3><div class="d">Each device stays signed in for 30 days. Sign everyone out if a device is lost or someone leaves.</div><button class="btn" data-act="ppOutAll">' + ic('lock') + 'Sign everyone else out</button></div>';
  h += '<div class="card"><h3>Sign in activity</h3><div class="d">Who signed in and when, plus wrong codes and changes made here. The latest ' + p.log.length + ' events.</div><div class="tw"><table class="t"><thead><tr><th style="cursor:default">When</th><th style="cursor:default">Who</th><th style="cursor:default">What</th><th style="cursor:default">Device or note</th></tr></thead><tbody>'
    + (p.log.length ? p.log.slice(0, 100).map(function(l){ return '<tr><td class="tx" style="white-space:nowrap" title="' + esc(new Date(l.at).toLocaleString()) + '">' + esc(whenAt(l.at)) + '</td><td class="tx">' + esc(l.email) + '</td><td class="tx">' + esc(l.event) + '</td><td class="tx">' + esc(l.note || '') + '</td></tr>'; }).join('') : '<tr><td colspan="4" class="tx" style="color:var(--mute)">Nothing yet</td></tr>') + '</tbody></table></div></div>';
  el.innerHTML = h + '</div>';
}
function whenAt(t){ var d = new Date(t), now = new Date(), tm = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); if (d.toDateString() === now.toDateString()) return 'Today ' + tm; var y = new Date(now.getTime() - 86400000); if (d.toDateString() === y.toDateString()) return 'Yesterday ' + tm; return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + tm; }
function ppDone(r, msg){ if (!r || !r.ok){ toast((r && r.error) || 'That did not work.'); return; } S.people = r; renderPeople(); if (msg) toast(msg); }
ACT.tcShow = function(){ var v = $('tcVal'); if (!v) return; var on = v.textContent === v.getAttribute('data-code'); v.textContent = on ? '\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022' : v.getAttribute('data-code'); var b = document.querySelector('[data-act="tcShow"]'); if (b) b.textContent = on ? 'Show' : 'Hide'; };
ACT.tcCopy = function(){ var v = $('tcVal'); if (v) copyText(v.getAttribute('data-code'), 'Team code copied.'); };
ACT.tcSave = function(){
  var c = val('tcNew').replace(/\s+/g, ''), out = !!($('tcOut') && $('tcOut').checked);
  if (c.length < 6){ toast('Use at least 6 characters for the team code.'); return; }
  call('apiTeamCode', c, out).then(function(r){ ppDone(r, out ? 'Team code saved. Signed out ' + (r && r.signedOut) + ' devices.' : 'Team code saved. Share it with your team.'); });
};
ACT.ppAdd = function(){ var e = val('ppEmail').trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(e)){ toast('Type a full email address.'); return; } call('apiPeopleSave', e, val('ppRole')).then(function(r){ ppDone(r, 'Added ' + e + '. They can sign in with the team code.'); }); };
ON.ppRole = function(el){ call('apiPeopleSave', el.getAttribute('data-arg'), el.value).then(function(r){ ppDone(r, 'Role changed.'); }); };
ACT.ppRestore = function(e){ call('apiPeopleSave', e, 'user').then(function(r){ ppDone(r, 'Access restored.'); }); };
ACT.ppUnlock = function(e){ call('apiPeopleUnlock', e).then(function(r){ ppDone(r, 'Unlocked.'); }); };
ACT.ppOut = function(e){ call('apiPeopleSignOut', e).then(function(r){ ppDone(r, 'Signed out of ' + (r && r.signedOut) + ' devices.'); }); };
ACT.ppRemove = function(e){ openModal({ kind: 'confirm', title: 'Remove access?', text: e + ' will be signed out and will not be able to sign in, even with the team code. Their chats are kept, and you can restore access later.', ok: 'Remove access', act: 'ppRemoveYes' }); S.modal.email = e; };
ACT.ppRemoveYes = function(){ var e = S.modal.email; closeModal(); call('apiPeopleRemove', e).then(function(r){ ppDone(r, 'Access removed.'); }); };
ACT.ppOutAll = function(){ openModal({ kind: 'confirm', title: 'Sign everyone else out?', text: 'Everyone except you will need to sign in again with the team code and an email code.', ok: 'Sign everyone out', act: 'ppOutAllYes' }); };
ACT.ppOutAllYes = function(){ closeModal(); call('apiPeopleSignOut', '*').then(function(r){ ppDone(r, 'Signed out ' + (r && r.signedOut) + ' devices.'); }); };
ACT.ppDomSave = function(){ call('apiPeopleDomains', val('ppDom')).then(function(r){ ppDone(r, 'Domains saved.'); }); };

</script>
</body>
</html>
