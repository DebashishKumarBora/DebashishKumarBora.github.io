<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Reports | Vertex demo</title>
<style>
:root{
  --black:#000000; --white:#FFFFFF; --gray:#A8AAAB; --gold:#CDA176;
  --ink:#141414; --ink2:#3E4041; --mute:#5C5E5F; --soft:#F4F4F3; --soft2:#ECECEA; --rule:#E4E4E2; --rule2:#CBCCCB;
  --serif:"Adobe Garamond Pro","EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  --sans:Calibri,Carlito,"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--white);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-weight:400}
b,strong,h1,h2,h3,h4,th{font-weight:400}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums lining-nums}
.caps{font-family:var(--sans);text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;color:var(--mute)}
.serif{font-family:var(--serif)}
.wrap{max-width:1180px;margin:0 auto;padding:0 40px}
.hide{display:none !important}

/* ---------- wordmark ---------- */
.wm{font-family:var(--serif);letter-spacing:.42em;font-size:19px;line-height:1;padding-left:.42em;display:inline-block}
.wm img{height:26px;display:block}

/* ---------- sign in (cover) ---------- */
.gate{min-height:100vh;background:var(--black);color:var(--white);display:flex;flex-direction:column}
.gate-top{padding:34px 48px}
.gate-mid{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:460px;text-align:center}
.gate-card .eyebrow{color:var(--gray)}
.gate-card h1{font-family:var(--serif);font-size:48px;line-height:1.1;margin:18px 0 0}
.goldrule{width:56px;height:1px;background:var(--gold);margin:26px auto}
.gate-card p{color:#C9CACA;font-size:15.5px;margin-bottom:34px}
.gate-in{width:100%;background:transparent;border:0;border-bottom:1px solid #5E5F60;color:var(--white);font-size:22px;letter-spacing:.18em;text-align:center;padding:12px 6px;outline:none;font-family:var(--sans);text-transform:uppercase}
.gate-in::placeholder{color:#6F7071;letter-spacing:.12em;text-transform:none}
.gate-in:focus{border-bottom-color:var(--white)}
.gate-btn{margin-top:30px;background:var(--white);color:var(--black);border:1px solid var(--white);padding:14px 34px;font-size:12.5px;text-transform:uppercase;letter-spacing:.18em;min-width:220px}
.gate-btn:hover{background:transparent;color:var(--white)}
.gate-btn:disabled{opacity:.6}
.gate-err{min-height:24px;margin-top:20px;color:#E9E9E9;font-size:14.5px}
.gate-foot{padding:30px 48px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;color:#8C8D8E;font-size:13px}
.tagline{font-family:var(--serif);font-size:17px;color:#BDBEBE;letter-spacing:.02em}

/* ---------- report: top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--white);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:28px;min-height:64px}
.tabs{display:flex;gap:26px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:1px solid transparent;padding:21px 0 20px;text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;color:var(--mute);white-space:nowrap}
.tabs button.on{color:var(--black);border-bottom-color:var(--gold)}
.tabs button:hover{color:var(--black)}
.acts{display:flex;gap:10px}
.tbtn{background:none;border:1px solid var(--rule2);padding:9px 16px;font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink)}
.tbtn:hover{border-color:var(--black)}

/* ---------- report: cover ---------- */
.hero{background:var(--black);color:var(--white)}
.hero .wrap{padding-top:76px;padding-bottom:64px}
.hero .eyebrow{color:var(--gray)}
.hero h1{font-family:var(--serif);font-size:72px;line-height:1.02;margin-top:16px;letter-spacing:-.005em}
.hero .goldrule{margin:30px 0}
.lede{font-family:var(--serif);font-size:26px;line-height:1.45;color:#EDEDED;max-width:920px}
.lede .n{color:var(--white);border-bottom:1px solid #6A6B6C}
.hero-meta{display:flex;gap:10px 34px;flex-wrap:wrap;margin-top:40px;color:var(--gray);font-size:12px;text-transform:uppercase;letter-spacing:.14em}
.hero-meta span b{color:#E6E6E6;font-weight:400}
.notice{background:var(--soft);border-bottom:1px solid var(--rule)}
.notice .wrap{padding-top:14px;padding-bottom:14px;font-size:14px;color:var(--mute)}

/* ---------- report: headline numbers ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px}
.kpi{background:var(--soft);padding:26px 26px 22px;min-width:0;display:flex;flex-direction:column}
.kpi .v{font-family:var(--serif);font-size:50px;line-height:1.05;margin:14px 0 12px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.kpi .d{font-size:13.5px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:28px;border-top:1px solid var(--black)}
.stat{padding:20px 20px 4px 0;min-width:0}
.stat+.stat{padding-left:20px;border-left:1px solid var(--rule)}
.stat .v{font-family:var(--serif);font-size:30px;line-height:1.1;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.stat .d{font-size:12.5px;color:var(--mute);margin-top:6px}

/* ---------- report: sections ---------- */
.sec{padding-top:72px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-top:1px solid var(--rule2);padding-top:22px;margin-bottom:26px;flex-wrap:wrap}
.sec-h h2{font-family:var(--serif);font-size:36px;line-height:1.1}
.sec-h .caps{margin-top:8px}
.seg{display:flex;gap:0;border:1px solid var(--rule2)}
.seg button{background:none;border:0;padding:8px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
.seg button+button{border-left:1px solid var(--rule2)}
.seg button.on{background:var(--black);color:var(--white)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:280px;overflow:visible}
.axis{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--mute)}
.ymax{position:absolute;top:-4px;left:0;font-size:12px;color:var(--mute);background:var(--white);padding-right:8px}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:14px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--black);vertical-align:middle;margin-right:8px}
.legend i.prev{border-top:2px dashed var(--gray)}
.legend i.peak{border-top:1px solid var(--gold);width:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.bars .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.bars .row:last-child{border-bottom:0}
.bars .nm{font-size:15.5px}
.bars .vl{font-family:var(--serif);font-size:22px;text-align:right;line-height:1.1}
.bars .tr{grid-column:1/-1;height:4px;background:var(--soft2)}
.bars .tr i{display:block;height:100%;background:var(--black)}
.bars .sub{grid-column:1/-1;font-size:12.5px;color:var(--mute);margin-top:-2px}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);padding:0 12px 12px 0;border-bottom:1px solid var(--black);white-space:nowrap}
.tbl td{padding:15px 12px 15px 0;border-bottom:1px solid var(--rule);font-size:15px;vertical-align:top}
.tbl .r{text-align:right}
.tbl td.r{font-variant-numeric:tabular-nums}
.tbl .t{font-size:12.5px;color:var(--mute);margin-top:2px}
.tbl tfoot td{border-bottom:0;border-top:1px solid var(--black);padding-top:14px}
.ads{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ad{border:1px solid var(--rule);padding:22px 24px 24px;background:var(--white)}
.ad .sp{font-size:12.5px;color:var(--ink)}
.ad .url{font-size:13px;color:var(--mute);margin:2px 0 10px;word-break:break-all}
.ad .hl{font-size:20px;line-height:1.3;color:var(--black)}
.ad .ds{font-size:14.5px;color:var(--ink2);margin-top:8px;line-height:1.55}
.cap{font-size:12.5px;color:var(--mute);margin-top:16px}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:0 56px}
.term{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--rule)}
.term .ix{font-family:var(--serif);color:var(--gray);font-size:18px}
.term .tx{font-size:15.5px;overflow-wrap:anywhere}
.term .vv{font-size:13px;color:var(--mute);white-space:nowrap;text-align:right}
.stack{display:flex;height:16px;background:var(--soft2);margin:6px 0 22px}
.stack i{display:block;height:100%}
.months{display:flex;align-items:flex-end;gap:10px;height:230px;border-bottom:1px solid var(--black);padding-top:28px}
.mo{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.mo .b{width:100%;max-width:54px;background:var(--gray)}
.mo.cur .b{background:var(--black)}
.mo.part .b{background:repeating-linear-gradient(135deg,var(--gray) 0 2px,var(--soft2) 2px 6px)}
.mo .lv{font-size:11.5px;color:var(--mute);margin-bottom:6px;white-space:nowrap}
.molab{display:flex;gap:10px;margin-top:10px}
.molab span{flex:1;text-align:center;font-size:11.5px;color:var(--mute);min-width:0;white-space:nowrap;overflow:hidden}
.note{background:var(--soft);padding:40px 44px}
.note .q{font-family:var(--serif);font-size:24px;line-height:1.5;white-space:pre-wrap;max-width:880px}
.note .by{margin-top:22px}
.empty{padding:28px 0;color:var(--mute);font-size:15px}
.gloss{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 40px;margin-top:6px}
.gloss div{font-size:14px;color:var(--mute);line-height:1.55}
.gloss div span{display:block;color:var(--ink);font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:4px}
.foot{background:var(--black);color:var(--white);margin-top:88px}
.foot .wrap{padding-top:52px;padding-bottom:52px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.foot .small{color:#8C8D8E;font-size:13px;max-width:560px;line-height:1.6}
.loading{min-height:100vh;background:var(--black);color:var(--gray);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;text-align:center;padding:24px}
.loading .tagline{font-size:22px}
.preview-bar{background:var(--gold);color:var(--black)}
.preview-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px;font-size:14px;flex-wrap:wrap}
.preview-bar button{background:var(--black);color:var(--white);border:0;padding:8px 16px;font-size:11.5px;text-transform:uppercase;letter-spacing:.14em}

/* ---------- top campaign and searches ---------- */
.tc{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;background:var(--soft)}
.tc-l{padding:40px 44px}
.tc-n{font-family:var(--serif);font-size:40px;line-height:1.1;margin:12px 0 18px;overflow-wrap:anywhere}
.tc-t{font-family:var(--serif);font-size:21px;line-height:1.55;color:var(--ink2);max-width:620px}
.tc-r{background:var(--black);color:var(--white);padding:36px 40px;display:grid;grid-template-columns:1fr 1fr;gap:28px 24px;align-content:center}
.tc-r .caps{color:var(--gray)}
.tc-r .v{font-family:var(--serif);font-size:40px;line-height:1.05;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.tc-r > div{min-width:0}
.tc-r .d{font-size:12.5px;color:#BDBEBE;margin-top:6px}
.tc-r .gr{width:28px;height:1px;background:var(--gold);margin-top:10px}
.s3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.s3 div{border-top:1px solid var(--black);padding:20px 0 4px}
.s3 .ix{display:block;font-family:var(--serif);font-size:44px;line-height:1;color:var(--mute)}
.s3 .tx{display:block;font-family:var(--serif);font-size:24px;line-height:1.3;margin-top:14px;overflow-wrap:anywhere}

@media (max-width:1000px){
  .tc{grid-template-columns:1fr}
  .tc-r{grid-template-columns:repeat(4,1fr)}
}
/* ---------- phone parts, hidden on larger screens ---------- */
.mbar{display:none}
.swipe-hint{display:none}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.sheet-in{background:var(--white);width:100%;padding:10px 0 calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto}
.sheet-in .grab{width:40px;height:4px;background:var(--rule2);margin:6px auto 14px}
.sheet-in .caps{padding:0 24px 8px}
.sheet-in button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--rule);padding:18px 24px;font-size:17px;text-align:left}
.sheet-in button.on{font-family:var(--serif);font-size:20px}
.sheet-in button .ck{width:8px;height:8px;border-radius:50%;background:var(--gold)}

/* =================== v4 experience: motion, interaction, chapters =================== */
/* motion: quick ease-out, transform and opacity only, and none for people who ask for less */
.rv{opacity:0;transform:translateY(18px);transition:opacity .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1)}
.rv.is-in{opacity:1;transform:none}
.draw{clip-path:inset(0 100% 0 0);transition:clip-path 1.1s cubic-bezier(.3,.7,.2,1)}
.is-in .draw,.draw.is-in{clip-path:inset(0 0 0 0)}
.top{background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(1.2) blur(10px);backdrop-filter:saturate(1.2) blur(10px)}
.tabs{position:relative}
.tabs button.on{border-bottom-color:transparent}
.tabs .ind{position:absolute;bottom:0;height:1px;background:var(--gold);transition:left .35s cubic-bezier(.3,.7,.2,1),width .35s cubic-bezier(.3,.7,.2,1);pointer-events:none}
.swap{animation:swapin .32s ease-out}
@keyframes swapin{from{opacity:.25}to{opacity:1}}

/* the cover as a stage */
.hero .wrap{min-height:min(78vh,760px);display:flex;flex-direction:column;justify-content:flex-end;padding-top:96px;padding-bottom:56px}
.hero h1 .w{display:inline-block;opacity:0;transform:translateY(.35em);animation:wordup .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes wordup{to{opacity:1;transform:none}}
.hero .goldrule{transform-origin:left;transform:scaleX(0);animation:rule .9s .35s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes rule{to{transform:scaleX(1)}}
.hero .lede,.hero .hero-meta{opacity:0;animation:fadein .8s .55s ease-out forwards}
.hero .hero-meta{animation-delay:.75s}
@keyframes fadein{to{opacity:1}}
.cue{display:flex;align-items:center;gap:14px;margin-top:44px;color:#8C8D8E;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
.cue i{display:block;width:44px;height:1px;background:#5E5F60;position:relative;overflow:hidden}
.cue i:after{content:'';position:absolute;left:0;top:0;height:1px;width:100%;background:var(--gold);transform:translateX(-100%);animation:cue 2.4s 1.2s ease-in-out 2}
@keyframes cue{to{transform:translateX(100%)}}

/* chapters */
.sec-h .ix{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sec-h .ix b{font-family:var(--serif);font-size:15px;color:var(--gold);letter-spacing:.04em;font-weight:400}
.sec-h .ix i{display:block;width:28px;height:1px;background:var(--rule2)}

/* cards with a quiet hover */
.kpi{position:relative;transition:background .2s ease-out}
.kpi:hover{background:var(--soft2)}
.kpi .sp{display:block;width:100%;height:34px;margin-top:auto;padding-top:14px;overflow:visible}

/* tooltips and crosshair */
.chart{position:relative;touch-action:pan-y;cursor:crosshair;outline:none}
.chart:focus-visible{box-shadow:inset 0 0 0 1px var(--black)}
.xh{position:absolute;top:0;bottom:0;width:1px;background:var(--black);opacity:0;pointer-events:none;transition:opacity .15s}
.dotp{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--white);border:2px solid var(--black);opacity:0;pointer-events:none;transition:opacity .15s}
.dotp.pv{border-color:var(--gray)}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--black);color:var(--white);padding:10px 14px 11px;min-width:150px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;white-space:nowrap}
.tip .tl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray)}
.tip .tv{font-family:var(--serif);font-size:26px;line-height:1.15;margin-top:4px}
.tip .tp{font-size:12px;color:#BDBEBE;margin-top:4px}
.on-hover .xh,.on-hover .dotp,.on-hover .tip{opacity:1}
.on-hover .tip{transform:none}
.area{fill:var(--soft)}

/* donuts */
.dn{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;align-items:center}
.dn-c{position:relative;width:240px;height:240px}
.dn-c svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.dn-c circle.sg{fill:none;stroke-width:16;transition:stroke-dasharray 1.1s cubic-bezier(.3,.7,.2,1),stroke-width .2s ease-out,opacity .2s;cursor:pointer}
.dn-c circle.sg.hi{stroke-width:22}
.dn-c.dim circle.sg:not(.hi){opacity:.35}
.dn-m{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 46px}
.dn-m .v{font-family:var(--serif);font-size:46px;line-height:1}
.dn-m .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:8px;line-height:1.4}
.lg .row{cursor:pointer;transition:opacity .2s}
.lg.dim .row:not(.hi){opacity:.4}
.ring{display:flex;align-items:center;gap:22px;grid-column:1/-1;padding-bottom:22px;border-bottom:1px solid #2A2B2C;margin-bottom:4px}
.ring svg{width:96px;height:96px;transform:rotate(-90deg);flex:0 0 96px}
.ring circle{fill:none;stroke-width:9}
.ring .rv2{transition:stroke-dasharray 1.2s .2s cubic-bezier(.3,.7,.2,1)}
.ring .rt{font-family:var(--serif);font-size:40px;line-height:1}
.ring .rl{font-size:12px;color:#BDBEBE;margin-top:6px;max-width:220px;line-height:1.45}

/* month bars that grow, with values on hover */
.mo .b{transform-origin:bottom;transform:scaleY(0);transition:transform .8s cubic-bezier(.3,.7,.2,1),background .15s}
.is-in .mo .b{transform:scaleY(1)}
.mo:hover .b{background:var(--black)}
.mo.part:hover .b{background:repeating-linear-gradient(135deg,var(--black) 0 2px,var(--soft2) 2px 6px)}
.mo .lv{opacity:.85;transition:opacity .15s}
.months:hover .mo .lv{opacity:.35}
.months:hover .mo:hover .lv{opacity:1;color:var(--black)}

/* a search, typed out, with the ad beneath it */
.srch{border:1px solid var(--black);display:flex;align-items:center;gap:14px;padding:16px 20px;max-width:720px;background:var(--white)}
.srch svg{width:18px;height:18px;flex:0 0 18px;stroke:var(--black);fill:none;stroke-width:2}
.srch .q{font-size:19px;min-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch .k{display:inline-block;width:1px;height:22px;background:var(--black);vertical-align:-4px;margin-left:2px}
.first-ad{max-width:720px;margin:14px 0 30px}
.first-ad .hl{font-size:22px}
.more-ads .caps{margin:6px 0 14px}

/* sign in */
.gate-card form{display:block}
.gf{display:block;text-align:left;margin-top:22px;opacity:0;transform:translateY(10px);animation:wordup .6s cubic-bezier(.2,.7,.2,1) forwards}
.gf:nth-of-type(2){animation-delay:.08s}.gf:nth-of-type(3){animation-delay:.16s}
.gf span{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#8C8D8E;margin-bottom:6px}
.gf .gate-in{text-align:left;font-size:19px;letter-spacing:.04em;text-transform:none;padding:10px 2px}
.gf .gate-in.pw{letter-spacing:.16em;text-transform:uppercase}
.gf .gate-in.bad{border-bottom-color:var(--gold)}
.gate-note{font-size:12.5px;color:#7D7E7F;margin-top:18px;line-height:1.55}

/* loading */
.bar{width:180px;height:1px;background:#2A2B2C;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;left:0;height:1px;width:40%;background:var(--gold);animation:load 1.3s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

@media (prefers-reduced-motion: reduce){

.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--black);margin-right:8px;vertical-align:middle}

.dot.warn{background:var(--gold)}

input[type=checkbox]{width:16px;height:16px;accent-color:var(--black);margin-top:3px;flex:0 0 auto}

/* =================== PHONE REPORT, its own layout (not a shrunken desktop) ===================
   Fixed type scale, so numbers never shrink next to each other:
   display 44 · title 26 · section 19 · tile number 22 · row number 17 · body 13.5 · small 11 · label 9.5 */
.m{background:var(--white);color:var(--ink);font-size:13.5px;line-height:1.45;min-height:100vh}
.m .caps{font-size:9.5px;letter-spacing:.13em}
.m-top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}

.m-top .wm{font-size:15px}
.m-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;margin-right:-12px;color:var(--black)}
.m-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.m-seg{display:flex;margin:0 16px 10px;border:1px solid var(--black)}
.m-seg button{flex:1 1 auto;min-height:40px;background:none;border:0;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--black);padding:0 3px;white-space:nowrap;transition:background .2s,color .2s}
.m-seg button+button{border-left:1px solid var(--black)}
.m-seg button.on{background:var(--black);color:var(--white)}
.m-seg.sm{margin:0 0 10px}
.m-seg.sm button{min-height:40px;font-size:9px}
.m-sum{background:var(--black);color:var(--white);margin:12px 16px 0;padding:18px 16px 16px}
.m-sum .e{color:var(--gray)}
.m-sum h1{font-family:var(--serif);font-size:26px;line-height:1.12;margin:6px 0 4px}
.m-sum .dt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8C8D8E}
.m-sum .big{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid #2A2B2C}
.m-sum .bv{font-family:var(--serif);font-size:44px;line-height:1;white-space:nowrap}
.m-sum .bl{color:#BDBEBE;margin-top:7px}
.m-sum .bc{font-size:11.5px;line-height:1.35;color:var(--gold);text-align:right;max-width:48%}
.m-sum svg{display:block;width:100%;height:34px;margin-top:12px;overflow:visible}
.m-sum .ld{font-size:13px;line-height:1.5;color:#D6D6D6;margin-top:12px}
.m-sum .ld .n{color:var(--white);border-bottom:1px solid #5E5F60}
.m-sec{padding:26px 16px 0}
.m-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.m-h h2{font-family:var(--serif);font-size:19px;line-height:1.2}
.m-h .x{flex:0 0 auto}
.m-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-tile{border:1px solid var(--rule);padding:10px 12px 9px;display:flex;flex-direction:column;min-width:0}
.m-tile .v{font-family:var(--serif);font-size:22px;line-height:1.1;margin-top:6px;white-space:nowrap}
.m-tile .c{font-size:10.5px;line-height:1.3;color:var(--mute);margin-top:3px;min-height:2.6em}
.m-tile svg{display:block;width:100%;height:22px;margin-top:auto;padding-top:8px;overflow:visible}
.m-rows{margin-top:10px;border-top:1px solid var(--black)}
.m-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule)}
.m-row .l{font-size:13px;line-height:1.3}
.m-row .l small{display:block;font-size:10.5px;color:var(--mute);margin-top:1px}
.m-row .v{font-family:var(--serif);font-size:17px;white-space:nowrap}
.m-hl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-hc{background:var(--soft);padding:11px 12px 12px;min-width:0;display:flex;flex-direction:column}
.m-hc.wide{grid-column:1/-1}
.m-hc .hv{font-family:var(--serif);font-size:17px;line-height:1.2;margin-top:5px;overflow-wrap:anywhere}
.m-hc .ht{font-size:11.5px;line-height:1.4;color:var(--mute);margin-top:auto;padding-top:3px}
.m-tc{border:1px solid var(--black)}
.m-tc .hd{padding:12px 12px 13px}
.m-tc .nm{font-family:var(--serif);font-size:19px;line-height:1.2;margin-top:4px;overflow-wrap:anywhere}
.m-tc .tx{font-size:12.5px;line-height:1.5;color:var(--ink2);margin-top:7px}
.m-tc .bk{background:var(--black);color:var(--white);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.m-tc .bk .caps{color:var(--gray)}
.m-tc .bk .v{font-family:var(--serif);font-size:20px;line-height:1.1;margin-top:4px;white-space:nowrap}
.m-tc .bk .c{font-size:10px;color:#BDBEBE;margin-top:2px;line-height:1.3}
.m-tc .rg{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid #2A2B2C}
.m-tc .rg svg{width:48px;height:48px;flex:0 0 48px;transform:rotate(-90deg)}
.m-tc .rg circle{fill:none;stroke-width:9}
.m-tc .rg .rv2{transition:stroke-dasharray 1.2s .2s cubic-bezier(.3,.7,.2,1)}
.m-tc .rg .rt{font-family:var(--serif);font-size:22px;line-height:1}
.m-tc .rg .rl{font-size:10.5px;color:#BDBEBE;margin-top:2px}
.m-ch .hv{font-family:var(--serif);font-size:30px;line-height:1.05;white-space:nowrap}
.m-ch .hs{margin:3px 0 10px;min-height:14px}
.m-ch .chart svg{height:150px}
.m-ch .chart .tip{display:none}
.m-ch .axis{font-size:10px;margin-top:6px}
.m-ch .legend{font-size:10.5px;gap:4px 12px;margin-top:6px}
.m .dn{grid-template-columns:104px minmax(0,1fr);gap:16px;align-items:center}
.m .dn-c{width:104px;height:104px;margin:0}
.m .dn-c circle.sg{stroke-width:18}
.m .dn-c circle.sg.hi{stroke-width:22}
.m .dn-m{padding:0 18px}
.m .dn-m .v{font-size:20px}
.m .dn-m .l{font-size:8px;margin-top:2px;letter-spacing:.06em}
.m .lg .row{padding:6px 0;gap:0 10px}
.m .lg .nm{font-size:12.5px}
.m .lg .vl{font-size:16px}
.m .lg .sub{font-size:10.5px}
.m-srch{border:1px solid var(--black);display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--white)}
.m-srch svg{width:14px;height:14px;flex:0 0 14px;stroke:var(--black);fill:none;stroke-width:2}
.m-srch .q{font-size:14px;min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-srch .k{display:inline-block;width:1px;height:15px;background:var(--black);vertical-align:-3px;margin-left:2px}
.m-ad{border:1px solid var(--rule);border-top:0;padding:10px 12px 11px}
.m-ad .sp{font-size:10px}
.m-ad .u{font-size:10.5px;color:var(--mute);margin:1px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-ad .hl{font-size:14.5px;line-height:1.3;color:var(--black)}
.m-ad .ds{font-size:11.5px;line-height:1.4;color:var(--ink2);margin-top:3px}
.m-adl{margin-top:12px;border-top:1px solid var(--black)}
.m-adl .it{padding:9px 0;border-bottom:1px solid var(--rule)}
.m-adl .it .hl{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m-adl .it .u{font-size:10.5px;color:var(--mute);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-cap{font-size:10.5px;line-height:1.45;color:var(--mute);margin-top:8px}
.m-list{border-top:1px solid var(--black)}
.m-list .it{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule)}
.m-list .ix{font-family:var(--serif);font-size:15px;color:var(--mute);flex:0 0 14px}
.m-list .tx{font-family:var(--serif);font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.m-mo .hv{font-family:var(--serif);font-size:24px;line-height:1.05}
.m-mo .hs{margin:3px 0 10px}
.m-bars{display:flex;align-items:flex-end;gap:4px;height:104px;border-bottom:1px solid var(--black);touch-action:pan-y}
.m-bars .mb{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;cursor:pointer}
.m-bars .mb i{display:block;width:100%;background:var(--gray);transform-origin:bottom;transform:scaleY(0);transition:transform .8s cubic-bezier(.3,.7,.2,1),background .15s}
.is-in .m-bars .mb i{transform:scaleY(1)}
.m-bars .mb.pt i{background:repeating-linear-gradient(135deg,var(--gray) 0 2px,var(--soft2) 2px 5px)}
.m-bars .mb.sel i{background:var(--black)}
.m-mlab{display:flex;gap:4px;margin-top:5px}
.m-mlab span{flex:1 1 0;min-width:0;text-align:center;font-size:9px;color:var(--mute);white-space:nowrap;overflow:visible}
.m-note{background:var(--soft);padding:14px 14px 15px}
.m-note .q{font-family:var(--serif);font-size:15px;line-height:1.5;white-space:pre-wrap;margin-top:6px}
.m-def{border-top:1px solid var(--black)}
.m-def summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px;cursor:pointer;font-size:13px}
.m-def summary::-webkit-details-marker{display:none}
.m-def summary span:last-child{font-size:18px;color:var(--mute);transition:transform .2s}
.m-def[open] summary span:last-child{transform:rotate(45deg)}
.m-def .g{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:4px 0 12px}
.m-def .g div{font-size:11.5px;line-height:1.45;color:var(--mute)}
.m-def .g b{display:block;font-weight:400;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink);margin-bottom:2px}
.m-foot{background:var(--black);color:var(--white);margin-top:30px;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.m-foot .tagline{font-size:13.5px;margin-top:10px}
.m-foot .sm{font-size:10.5px;line-height:1.5;color:#8C8D8E;margin-top:8px}
.m .notice .wrap{padding:8px 16px;font-size:11.5px}
.m .preview-bar .wrap{padding:8px 16px;font-size:12px}
.m-pend{margin:12px 16px 0;padding:18px 16px;background:var(--black);color:var(--white)}
@media (prefers-reduced-motion: reduce){ .m-bars .mb i{transform:none;transition:none} .m-tc .rg .rv2{transition:none} .m-seg button{transition:none} }

/* =================== at a glance, weekdays, timeline, story, logo =================== */
.wins{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.win{border-top:1px solid var(--black);padding:18px 0 4px;min-width:0}
.win .wb{font-family:var(--serif);font-size:40px;line-height:1.08;margin:12px 0 8px;overflow-wrap:anywhere}
.win .wt{font-size:14.5px;color:var(--mute);line-height:1.5}
.glance{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px;background:var(--soft);padding:22px 24px}
.glance .gv{font-family:var(--serif);font-size:26px;line-height:1.2;margin-top:8px}
.glance .gv small{font-family:var(--sans);font-size:13px;color:var(--mute)}
.glance .gl{font-size:14.5px;line-height:1.5;margin-top:8px}
.glance .gl.rec{padding-left:16px;position:relative}
.glance .gl.rec:before{content:'';position:absolute;left:0;top:.75em;width:8px;height:1px;background:var(--gold)}
.story-btn{background:var(--black);color:var(--white);border:0;padding:12px 20px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:opacity .2s}
.story-btn span{color:var(--gold);margin-left:6px}
.story-btn:hover{opacity:.85}
.wkl{font-family:var(--serif);font-size:22px;margin:-6px 0 18px}
.wds{display:flex;align-items:flex-end;gap:14px;height:200px;border-bottom:1px solid var(--black)}
.wd{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;min-width:0}
.wd i{display:block;width:100%;max-width:64px;background:var(--gray);transform-origin:bottom;transform:scaleY(0);transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.is-in .wd i{transform:scaleY(1)}
.wd.best i{background:var(--black)}
.wd .wv{font-size:12px;color:var(--mute);margin-bottom:6px}
.wd.best .wv{color:var(--black)}
.wd .wl{position:absolute;bottom:-24px;font-size:11.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.wd.best .wl{color:var(--black)}
#s-week{padding-bottom:26px}
.tls{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.tl{list-style:none;margin-top:12px;border-left:1px solid var(--rule2);padding-left:22px}
.tl li{position:relative;padding:0 0 18px}
.tl li:before{content:'';position:absolute;left:-26px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.tl .td{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tl .tt{display:block;font-family:var(--serif);font-size:19px;line-height:1.4;margin-top:3px}
.plogo{display:inline-flex;align-items:center;justify-content:center;background:#FFFFFF;padding:8px 12px;margin-bottom:22px}
.plogo img{display:block;max-height:40px;max-width:160px}
.pcover{display:none}
/* phone parts */
.m-sum{position:relative}
.m-logo{position:absolute;top:14px;right:14px;padding:5px 8px;margin:0}
.m-logo img{max-height:26px;max-width:90px}
.m-sumf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid #2A2B2C}
.m-sumf .caps{color:var(--gray)}
.m-sumf .fv{font-family:var(--serif);font-size:17px;line-height:1.25;margin-top:3px;color:var(--white)}
.m-sumf .fv.sm{font-size:14px}
.m-sumf small{font-family:var(--sans);font-size:10.5px;color:#BDBEBE}
.m-recap{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:14px;min-height:42px;padding:0 14px;background:transparent;color:var(--white);border:1px solid #5E5F60;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.m-recap span{color:var(--gold);font-size:15px;letter-spacing:0}
.m-recs{margin-top:8px}
.m-recs div{font-size:12px;line-height:1.45;color:var(--mute);padding:6px 0 6px 14px;position:relative;border-bottom:1px solid var(--rule)}
.m-recs div:before{content:'';position:absolute;left:0;top:13px;width:7px;height:1px;background:var(--gold)}
.m-wkl{font-family:var(--serif);font-size:15.5px;line-height:1.4;margin:-2px 0 12px}
.wds.wds-ph{height:110px;gap:6px;margin-bottom:22px}
.wds.wds-ph .wv{font-size:9.5px;margin-bottom:3px}
.wds.wds-ph .wl{font-size:9px;bottom:-18px}
.tls.tls-ph{grid-template-columns:1fr;gap:12px}
.tls.tls-ph .tl{margin-top:8px;padding-left:16px}
.tls.tls-ph .tl li{padding-bottom:12px}
.tls.tls-ph .tl li:before{left:-20px;top:5px;width:6px;height:6px}
.tls.tls-ph .tl .td{font-size:9.5px}
.tls.tls-ph .tl .tt{font-size:15px}
/* best day of the week, as one statement */
.wk1{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 40px;align-items:baseline;border-top:1px solid var(--black);padding-top:22px}
.wk1 .d{font-family:var(--serif);font-size:56px;line-height:1}
.wk1 .t{font-family:var(--serif);font-size:24px;line-height:1.4;color:var(--ink2)}
.m-wk1{background:var(--soft);padding:12px 12px 13px}
.m-wk1 .t{font-family:var(--serif);font-size:16px;line-height:1.4;margin-top:4px}
@media (max-width:760px){ .wk1{grid-template-columns:1fr} .wk1 .d{font-size:40px} }
/* the recap story */
.story{position:fixed;inset:0;z-index:95;background:var(--black);color:var(--white);display:flex;flex-direction:column;touch-action:pan-y;outline:none;user-select:none;-webkit-user-select:none}
.st-bars{display:flex;gap:4px;padding:calc(14px + env(safe-area-inset-top)) 16px 0;max-width:640px;width:100%;margin:0 auto}
.st-bars i{flex:1;height:2px;background:#333435;transition:background .3s}
.st-bars i.done{background:#8C8D8E}
.st-bars i.on{background:var(--gold)}
.st-x{position:absolute;top:calc(22px + env(safe-area-inset-top));right:8px;width:44px;height:44px;background:none;border:0;color:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer}
.st-x svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.5;fill:none}
.st-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 28px}
.sc{max-width:560px;width:100%;animation:scin .45s cubic-bezier(.2,.7,.2,1)}
@keyframes scin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sc .caps{color:var(--gray);font-size:11px}
.sc .goldrule{margin:18px 0 22px;width:44px}
.sc .sb{font-family:var(--serif);font-size:clamp(48px,14vw,96px);line-height:1.02;overflow-wrap:anywhere}
.sc .sb.long{font-size:clamp(30px,8vw,52px);line-height:1.15}
.sc.intro .sb,.sc.outro .sb{font-size:clamp(34px,9vw,60px);line-height:1.1}
.sc .stx{font-size:18px;color:#D6D6D6;margin-top:14px;line-height:1.45}
.sc .ss{font-size:14px;color:var(--gold);margin-top:12px;line-height:1.5}
.sc.outro .stx{font-family:var(--serif);color:#BDBEBE}
.sc .sh{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7D7E7F;margin-top:40px}
.st-done{margin-top:34px;background:var(--white);color:var(--black);border:0;min-height:44px;padding:0 26px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.st-nav{display:flex;justify-content:space-between;align-items:center;padding:0 12px calc(14px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto;color:#7D7E7F;font-size:11px;letter-spacing:.14em}
.st-nav button{width:52px;height:44px;background:none;border:1px solid #333435;color:var(--white);font-size:20px;cursor:pointer}
@media (max-width:760px){
  .wins{grid-template-columns:1fr}
  .glance{grid-template-columns:1fr}
  .tls{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .sc{animation:none} .wd i,.is-in .wd i{transform:none;transition:none} .st-bars i{transition:none} }

/* =================== dark mode, following the phone or computer setting ===================
   The colour variables swap; panels designed to be black set the originals
   again for themselves, so they stay black stages. The admin console stays light. */
@media (prefers-color-scheme: dark){
  :root{--black:#EDEDED;--white:#0B0B0B;--ink:#EAEAEA;--ink2:#C9CBCC;--mute:#A3A5A6;--soft:#161617;--soft2:#232425;--rule:#262728;--rule2:#3A3B3C;color-scheme:dark}
  .hero,.m-sum,.tc-r,.m-tc .bk,.foot,.m-foot,.gate,.loading,.story,.pcover,.tip,.m-pend,.preview-bar{--black:#000000;--white:#FFFFFF;--ink:#141414;--ink2:#3E4041;--mute:#9C9E9F;--soft:#1A1A1A;--soft2:#2A2B2C;--rule:#2A2B2C;--rule2:#3A3B3C}
  .hero,.m-sum,.tc-r,.m-tc .bk,.foot,.m-foot{box-shadow:inset 0 0 0 1px #232425}
  .top{background:rgba(11,11,11,.9)}
  .m-top{background:rgba(11,11,11,.92)}
  .adm,.adm *,#modal .mask{--black:#000000;--white:#FFFFFF;--ink:#141414;--ink2:#3E4041;--mute:#5C5E5F;--soft:#F4F4F3;--soft2:#ECECEA;--rule:#E4E4E2;--rule2:#CBCCCB;color-scheme:light}
  .adm{background:#FFFFFF;color:#141414;min-height:100vh}
  .plogo{background:#FFFFFF}
  .story-btn{--black:#000000;--white:#FFFFFF;box-shadow:inset 0 0 0 1px #3A3B3C}
  img{opacity:.96}
}

/* ---------- printing (Download PDF) ---------- */
@media print{
  @page{margin:12mm}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  :root{--black:#000000;--white:#FFFFFF;--ink:#141414;--ink2:#3E4041;--mute:#5C5E5F;--soft:#F4F4F3;--soft2:#ECECEA;--rule:#E4E4E2;--rule2:#CBCCCB;color-scheme:light}
  html,body{background:#FFFFFF !important}
  .top,.mbar,.sheet,.seg,.preview-bar,.toast,.noprint,.swipe-hint,.cue,.tip,.xh,.dotp,.story,.story-btn,.hero{display:none !important}
  .pcover{display:flex !important;flex-direction:column;justify-content:space-between;min-height:250mm;background:#000 !important;color:#fff;padding:18mm 16mm;page-break-after:always;break-after:page}
  .pcover .pc-top{display:flex;justify-content:space-between;align-items:center}
  .pcover .caps{color:#A8AAAB}
  .pcover h1{font-family:var(--serif);font-size:54px;line-height:1.05;margin-top:14px}
  .pcover .pc-dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#BDBEBE;margin-top:12px}
  .pcover .goldrule{margin:26px 0 0;width:56px;height:1px;background:#CDA176}
  .pcover .pc-w{list-style:none;margin-top:10px}
  .pcover .pc-w li{font-family:var(--serif);font-size:19px;line-height:1.45;padding:9px 0 9px 22px;border-bottom:1px solid #2A2B2C;position:relative}
  .pcover .pc-w li:before{content:'';position:absolute;left:0;top:21px;width:10px;height:1px;background:#CDA176}
  .pcover .pc-y{font-size:14px;color:#BDBEBE;margin-top:22px}
  .pcover .pc-foot{display:flex;justify-content:space-between;font-size:11px;color:#8C8D8E}
  .wd i,.is-in .wd i{transform:none !important}
  .wins{grid-template-columns:repeat(3,1fr) !important}
  .glance{grid-template-columns:repeat(3,1fr) !important}
  .rv,.hero h1 .w,.hero .goldrule,.hero .lede,.hero .hero-meta{opacity:1 !important;transform:none !important;animation:none !important}
  .draw{clip-path:none !important}
  .mo .b{transform:none !important}
  .hero .wrap{min-height:0 !important}
  .stats{display:grid !important;grid-template-columns:repeat(4,1fr) !important;margin:28px 0 0 !important;padding:0 !important}
  .tc{grid-template-columns:1.25fr 1fr !important}
  .s3{grid-template-columns:repeat(3,1fr) !important}
  .mscroll .months,.mscroll .molab{width:auto !important}
  .hero .wrap{padding-top:40px;padding-bottom:40px}
  .sec{page-break-inside:avoid;break-inside:avoid;padding-top:36px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .two{grid-template-columns:1fr 1fr}
  .foot{margin-top:40px}
}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="wm">VERTEX</span></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>
<script src="../kit/kit.js"></script>
<script src="mock.js"></script>
<script>
/* ============================== Vertex Client Reports, page ============================== */
var BOOT = window.__BOOT__ || { mode: 'client', link: '', brand: {} };
var S = { outside: [], printing: false, token: '', R: null, period: 'last30', metric: 'clicks', A: null, preview: null, busy: false, seen: {}, vals: {}, ind: null, swap: false, sheet: null };
var LS_KEY = 'vxcr_pass';
var PERIOD_ORDER = ['last30', 'lastMonth'];
var METRICS = { clicks: 'Clicks', conv: 'Conversions', cost: 'Spend', impr: 'Impressions' };

/* ---------------- helpers ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function call(fn){
  var args = [].slice.call(arguments, 1);
  return new Promise(function(res, rej){
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    r[fn].apply(r, args);
  });
}
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ t.classList.remove('on'); }, 3200); }
function store(k, v){ try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
function load(k){ try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function int(n){ return Math.round(Number(n) || 0).toLocaleString('en-US'); }
function money(n){ n = Number(n) || 0; return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function moneyShort(n){ n = Number(n) || 0; return n >= 1000 ? ('$' + Math.round(n).toLocaleString('en-US')) : money(n); }
function conv(n){ n = Number(n) || 0; return (n < 100 && Math.round(n * 10) % 10 !== 0) ? n.toFixed(1) : int(n); }
function pct(n){ return (Number(n) || 0).toFixed(2) + '%'; }
function rate(a, b){ return b > 0 ? a / b : 0; }
function when(iso, year){
  var m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return m[Number(iso.slice(5, 7)) - 1] + ' ' + Number(iso.slice(8, 10)) + (year ? ', ' + iso.slice(0, 4) : '');
}
function ago(t){
  if (!t) return 'never';
  var m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  var h = Math.round(m / 60); if (h < 48) return h + ' h ago';
  return Math.round(h / 24) + ' days ago';
}
function copyText(text, msg){
  var ok = false;
  try { var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); document.body.removeChild(ta); } catch (e) { ok = false; }
  if (ok){ toast(msg || 'Copied.'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast(msg || 'Copied.'); }, function(){ toast('Select the text and copy it manually.'); });
  else toast('Select the text and copy it manually.');
}
function wordmark(dark){
  var b = BOOT.brand || {}, src = dark ? b.logoDark : b.logoLight;
  return src ? '<span class="wm"><img src="' + esc(src) + '" alt="Vertex"></span>' : '<span class="wm">VERTEX</span>';
}
/* Comparisons only ever read as good news, and are never false:
     higher is better: up shows "Up 12% from...", a small dip shows "86% of...",
       below 60% shows the plain description instead.
     lower is better (costs): lower shows "12% lower than...", higher shows the description.
     neutral (spend): always the description, never a comparison. */
function cmp(cur, prev, compare, better, plain){
  cur = Number(cur) || 0; prev = Number(prev) || 0;
  if (better === 'none' || !prev || !cur) return plain;
  var r = cur / prev;
  if (better === 'up' && r < 1) return plain;
  if (Math.abs(r - 1) < 0.005) return 'In line with ' + compare;
  if (better === 'up'){
    if (r > 4) return '\u2191 Up more than 300% from ' + compare;
    if (r > 1) return '\u2191 Up ' + Math.round((r - 1) * 100) + '% from ' + compare;
    return plain;
  }
  if (r < 1) return Math.round((1 - r) * 100) + '% lower than ' + compare;
  return plain;
}

/* ============================== start ============================== */
function boot(){
  if (BOOT.mode === 'admin'){ adminStart(); return; }
  S.token = load(LS_KEY);
  if (S.token) loadReport(); else showGate('');
}

/* ============================== sign in ============================== */
var WHO_KEY = 'vxcr_who';
function savedWho(){ try { return JSON.parse(load(WHO_KEY) || '{}') || {}; } catch (e) { return {}; } }
function showGate(msg){
  S.R = null;
  document.title = 'Google Ads Report | Vertex';
  var w = savedWho();
  $('app').innerHTML = '<div class="gate">'
    + '<div class="gate-top">' + wordmark(true) + '</div>'
    + '<div class="gate-mid"><div class="gate-card">'
    + '<div class="caps eyebrow">Client report</div>'
    + '<h1>Google Ads Performance</h1><div class="goldrule"></div>'
    + '<p>Sign in with your details and the password your Vertex marketing team sent you. In this demo, any password works.</p>'
    + '<form onsubmit="signIn();return false;" autocomplete="on" novalidate>'
    + '<label class="gf"><span>Your name</span><input class="gate-in" id="gName" name="name" autocomplete="name" value="' + esc(w.name || '') + '"></label>'
    + '<label class="gf"><span>Email</span><input class="gate-in" id="gEmail" name="email" type="email" autocomplete="email" inputmode="email" value="' + esc(w.email || '') + '"></label>'
    + '<label class="gf"><span>Password</span><input class="gate-in pw" id="pw" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="characters"></label>'
    + '<div><button class="gate-btn" id="go" type="submit">View report</button></div>'
    + '<div class="gate-err" id="gerr" role="alert">' + esc(msg || '') + '</div>'
    + '<div class="gate-note">Your name and email are recorded with each visit, so your Vertex team knows who has seen the report.</div>'
    + '</form></div></div>'
    + '<div class="gate-foot"><span class="tagline">Clear numbers. Confident decisions.</span><span>Private report. Please do not share your password.</span></div>'
    + '</div>';
  var f = !w.name ? $('gName') : (!w.email ? $('gEmail') : $('pw'));
  if (f) f.focus();
}
function markBad(id){ ['gName', 'gEmail', 'pw'].forEach(function(x){ var e = $(x); if (e) e.classList.toggle('bad', x === id); }); var e = $(id); if (e) e.focus(); }
function signIn(){
  if (S.busy) return;
  var name = $('gName').value.trim(), email = $('gEmail').value.trim(), pw = $('pw').value;
  if (!name){ $('gerr').textContent = 'Please enter your name.'; markBad('gName'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)){ $('gerr').textContent = 'Please enter a valid email address.'; markBad('gEmail'); return; }
  if (!pw.replace(/\s/g, '')){ $('gerr').textContent = 'Please enter your password.'; markBad('pw'); return; }
  S.busy = true; $('go').disabled = true; $('go').textContent = 'Opening';
  call('clientSignIn', pw, name, email).then(function(r){
    S.busy = false;
    if (!r || !r.ok){
      $('go').disabled = false; $('go').textContent = 'View report'; $('gerr').textContent = (r && r.error) || 'Please try again.';
      markBad(r && r.field === 'name' ? 'gName' : (r && r.field === 'email' ? 'gEmail' : 'pw'));
      if (!r || r.field === 'pw') $('pw').select();
      return;
    }
    store(WHO_KEY, JSON.stringify({ name: name, email: email }));
    S.token = r.token; store(LS_KEY, r.token);
    loadReport();
  }).catch(function(){ S.busy = false; $('go').disabled = false; $('go').textContent = 'View report'; $('gerr').textContent = 'Something went wrong. Please try again.'; });
}
function signOut(){ store(LS_KEY, ''); S.token = ''; S.seen = {}; S.vals = {}; showGate('You have signed out.'); }

/* ============================== the report ============================== */
function loadReport(){
  $('app').innerHTML = '<div class="loading">' + wordmark(true) + '<div class="tagline">Preparing your report</div><div class="bar"><i></i></div></div>';
  call('clientReport', S.token).then(function(r){
    if (!r || r.signedOut){ store(LS_KEY, ''); S.token = ''; showGate('Please sign in again.'); return; }
    if (r.error){ showGate(r.error); return; }
    S.R = r; S.preview = null; S.seen = {}; S.vals = {}; S.ind = null; render();
  }).catch(function(){ showGate('Your report could not be loaded. Please try again.'); });
}
function periodsOf(R){ var p = (R.report && R.report.periods) || {}; return PERIOD_ORDER.filter(function(k){ return !!p[k]; }); }
function setPeriod(k){ if (k === S.period) return; S.period = k; S.swap = true; var y = window.pageYOffset; render(); window.scrollTo(0, y); }
function setMetric(k){ if (k === S.metric) return; S.metric = k; var y = window.pageYOffset; render(); window.scrollTo(0, y); }
function reduced(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }

var MQ = window.matchMedia ? window.matchMedia('(max-width: 760px)') : null;
function isPhone(){ return !!(MQ && MQ.matches); }
if (MQ){ var mqh = function(){ if (S.R && !S.sheet) render(); }; if (MQ.addEventListener) MQ.addEventListener('change', mqh); else if (MQ.addListener) MQ.addListener(mqh); }

var CH = {};
function render(){
  var R = S.R; if (!R) return;
  S.seen = S.seen || {}; S.vals = S.vals || {};
  document.title = R.name + ' | Google Ads Report | Vertex';
  if (isPhone() && !S.printing){ renderPhone(R); return; }
  if (R.pending){
    $('app').innerHTML = topBar(R, []) + phoneBar(R, []) + '<div class="hero"><div class="wrap"><div class="caps eyebrow">Google Ads report</div><h1>' + words(R.name) + '</h1><div class="goldrule"></div>'
      + '<p class="lede">Your report is being prepared. Please check back a little later today.</p></div></div>' + footer(R);
    return;
  }
  var list = periodsOf(R);
  if (list.indexOf(S.period) < 0) S.period = list.indexOf('last30') > -1 ? 'last30' : list[0];
  var P = R.report.periods[S.period], sec = R.sections || {}, n = 0;
  CH = {};
  function ch(){ n++; return n < 10 ? '0' + n : String(n); }
  function peek(){ var m = n + 1; return m < 10 ? '0' + m : String(m); }
  function opt(x){ if (x){ n++; h += x; } }
  var h = printCover(R, P);
  if (S.preview) h += '<div class="preview-bar noprint"><div class="wrap"><span>Preview of exactly what ' + esc(R.name) + ' sees.</span><button onclick="adminBack()">Back to admin</button></div></div>';
  h += topBar(R, list) + phoneBar(R, list);
  h += hero(R, P);
  if (R.stale) h += '<div class="notice"><div class="wrap">These figures were last updated ' + esc(R.updatedText) + ', more than a day ago. Your Vertex team has been notified.</div></div>';
  h += '<div class="wrap' + (S.swap ? ' swap' : '') + '">';
  if (sec.wins !== false) opt(winsSec(R, P, peek()).replace('class="sec rv" id="s-wins"', 'class="sec rv" id="s-wins" style="padding-top:56px"'));
  h += '<section class="sec rv" id="s-kpi"' + (n ? '' : ' style="padding-top:56px"') + '>' + secHead('Overview', P.label, '', ch()) + kpis(P) + '</section>';
  if (sec.top !== false && P.top) h += topCampaign(P, ch());
  if (sec.weekdays !== false) opt(weekSec(P, peek(), false));
  if (sec.devices !== false && P.devices && P.devices.length) h += devices(P, ch());
  if (sec.ads !== false && R.report.ads && R.report.ads.length) h += adsSec(R.report.ads, (sec.searches !== false && R.report.searches) ? R.report.searches[0] : '', ch());
  if (sec.searches !== false && R.report.searches && R.report.searches.length) h += searches(R.report.searches, ch());
  if (sec.timeline !== false) opt(timelineSec(R, peek(), false));
  if (R.notes && R.notes.text) h += '<section class="sec rv" id="s-note"><div class="note"><div class="caps">A note from your Vertex team' + (R.notes.atText ? ' \u00b7 ' + esc(R.notes.atText) : '') + '</div><div class="q" style="margin-top:16px">' + esc(R.notes.text) + '</div></div></section>';
  h += glossary(R) + '</div>' + footer(R);
  $('app').innerHTML = h;
  S.swap = false;
  var ms = document.querySelector('.mscroll'); if (ms) ms.scrollLeft = ms.scrollWidth;
  tidy();
  placeInd();
  wireCharts();
  reveal();
  watchWidth();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (S.R && !S.R.pending){ tidy(); S.ind = null; placeInd(); } });
}
/* Re-line up whenever the page width really changes: a scrollbar appearing,
   fonts settling, a window resized. Height changes are ignored, so this never loops. */
var WW = { ro: null, w: 0 };
function watchWidth(){
  if (!window.ResizeObserver || WW.ro) return;
  WW.ro = new ResizeObserver(function(){
    var w = document.documentElement.clientWidth;
    if (w === WW.w) return;
    WW.w = w;
    if (S.R && !S.R.pending){ tidy(); S.ind = null; placeInd(); }
  });
  WW.w = document.documentElement.clientWidth;
  WW.ro.observe(document.body);
}

/* ---------------- motion engine ---------------- */
function ease(t){ return 1 - Math.pow(1 - t, 3); }
/* counts a number up to its final text, from the value it showed before */
function countTo(el){
  var fin = el.getAttribute('data-final') || '', key = el.getAttribute('data-key') || '';
  var m = /^([^\d]*)([\d,]+(?:\.\d+)?)(.*)$/.exec(fin);
  if (!m){ el.textContent = fin; return; }
  var dec = (m[2].split('.')[1] || '').length, target = parseFloat(m[2].replace(/,/g, ''));
  var from = key && S.vals[key] !== undefined ? S.vals[key] : 0;
  if (key) S.vals[key] = target;
  if (reduced() || from === target){ el.textContent = fin; return; }
  var t0 = null, dur = 900;
  function fmt(v){ return m[1] + v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + m[3]; }
  function step(ts){
    if (!el.isConnected) return;
    if (t0 === null) t0 = ts;
    var k = Math.min(1, (ts - t0) / dur);
    el.textContent = k < 1 ? fmt(from + (target - from) * ease(k)) : fin;
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function play(sec){
  [].forEach.call(sec.querySelectorAll('[data-final]'), countTo);
  [].forEach.call(sec.querySelectorAll('circle[data-dash]'), function(c){ c.style.strokeDasharray = c.getAttribute('data-dash'); });
}
/* sections rise in once as they arrive; after a period change they are already in */
function reveal(){
  var secs = [].slice.call(document.querySelectorAll('.rv'));
  var lede = document.querySelector('.hero .lede'); if (lede) play(lede);
  if (reduced() || !window.IntersectionObserver){ secs.forEach(function(s){ s.classList.add('is-in'); play(s); }); return; }
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if (!e.isIntersecting) return; var s = e.target; io.unobserve(s); s.classList.add('is-in'); S.seen[s.id] = 1; play(s); });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
  secs.forEach(function(s){
    if (S.seen[s.id]){ s.style.transition = 'none'; s.classList.add('is-in'); s.offsetHeight; s.style.transition = ''; play(s); }
    else io.observe(s);
  });
}
window.addEventListener('beforeprint', function(){
  if (S.R && isPhone() && !S.printing){ S.printing = true; render(); }
  [].forEach.call(document.querySelectorAll('.rv'), function(s){ s.classList.add('is-in'); });
  [].forEach.call(document.querySelectorAll('[data-final]'), function(e){ e.textContent = e.getAttribute('data-final'); });
});
window.addEventListener('afterprint', function(){ if (S.printing){ S.printing = false; if (S.R) render(); } });
function num(txt, key){ return '<span class="cnt" data-final="' + esc(txt) + '" data-key="' + esc(key) + '">' + esc(txt) + '</span>'; }
function words(t){ return esc(t).split(' ').map(function(w, i){ return '<span class="w" style="animation-delay:' + (0.08 * i).toFixed(2) + 's">' + w + '</span>'; }).join(' '); }

/* ---------------- top bars ---------------- */
function placeInd(){
  var nav = document.querySelector('.tabs'), on = nav && nav.querySelector('button.on'); if (!on) return;
  var ind = nav.querySelector('.ind'); if (!ind){ ind = document.createElement('i'); ind.className = 'ind'; nav.appendChild(ind); }
  var to = { l: on.offsetLeft, w: on.offsetWidth };
  if (S.ind){ ind.style.transition = 'none'; ind.style.left = S.ind.l + 'px'; ind.style.width = S.ind.w + 'px'; ind.offsetHeight; ind.style.transition = ''; }
  ind.style.left = to.l + 'px'; ind.style.width = to.w + 'px';
  S.ind = to;
}
window.addEventListener('resize', function(){ if (S.R && !S.R.pending){ tidy(); S.ind = null; placeInd(); } });
/* decorative marks (like the gold chapter numbers) are skipped by the contrast audit */
function topBar(R, list){
  return '<div class="top"><div class="wrap">' + wordmark(false)
    + '<nav class="tabs" aria-label="Report period">' + list.map(function(k){ return '<button class="' + (k === S.period ? 'on' : '') + '" onclick="setPeriod(\'' + k + '\')">' + esc(R.report.periods[k].label) + '</button>'; }).join('') + '</nav>'
    + '<div class="acts">' + (R.pending ? '' : '<button class="tbtn" onclick="window.print()">Download PDF</button>') + (S.preview ? '' : '<button class="tbtn" onclick="signOut()">Sign out</button>') + '</div>'
    + '</div></div>';
}
function phoneBar(R, list){
  var cur = (R.report && R.report.periods && R.report.periods[S.period]) ? R.report.periods[S.period].label : '';
  return '<div class="mbar"><div class="row1">' + wordmark(false) + '<button class="menu" onclick="openSheet(\'menu\')">Menu</button></div>'
    + (list.length ? '<button class="pick" onclick="openSheet(\'period\')"><span>' + esc(cur) + '</span><span>Change \u203a</span></button>' : '') + '</div>';
}
function openSheet(kind){
  var R = S.R, h = '';
  if (kind === 'period'){
    h = '<div class="caps">Show results for</div>' + periodsOf(R).map(function(k){
      return '<button class="' + (k === S.period ? 'on' : '') + '" onclick="closeSheet();setPeriod(\'' + k + '\')"><span>' + esc(R.report.periods[k].label) + '</span>' + (k === S.period ? '<span class="ck"></span>' : '') + '</button>';
    }).join('');
  } else {
    h = '<div class="caps">' + esc(R.name) + '</div>'
      + (R.pending ? '' : '<button onclick="closeSheet();window.print()"><span>Download PDF</span></button>')
      + (S.preview ? '<button onclick="closeSheet();adminBack()"><span>Back to admin</span></button>' : '<button onclick="closeSheet();signOut()"><span>Sign out</span></button>');
  }
  S.sheet = kind;
  $('modal').innerHTML = '<div class="sheet" onclick="if(event.target===this)closeSheet()" role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div>' + h + '</div></div>';
}
function closeSheet(){ S.sheet = null; $('modal').innerHTML = ''; }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && S.sheet) closeSheet(); });
document.addEventListener('pointerdown', function(ev){ (S.outside || []).forEach(function(f){ f(ev.target); }); });

/* ---------------- cover ---------------- */
function lede(P){
  var t = P.totals, lead;
  if (S.period === 'thisMonth') lead = 'So far this month';
  else if (S.period === 'lastMonth') lead = 'In ' + P.label;
  else lead = 'In the ' + P.label.toLowerCase();
  if (!t.impr) return lead + ', your Google Ads did not run.';
  var s = lead + ', your Google Ads were shown <span class="n">' + num(int(t.impr), 'l-impr') + '</span> times and brought <span class="n">' + num(int(t.clicks), 'l-clicks') + '</span> ' + (t.clicks === 1 ? 'click' : 'clicks') + ' to your website.';
  if (t.conv > 0) s += ' They produced <span class="n">' + num(conv(t.conv), 'l-conv') + '</span> ' + (t.conv === 1 ? 'conversion' : 'conversions') + ', at <span class="n">' + num(money(rate(t.cost, t.conv)), 'l-cpa') + '</span> each.';
  return s;
}
function hero(R, P){
  var who = R.viewer && R.viewer.name ? ' \u00b7 Prepared for ' + esc(R.viewer.name) : '';
  return '<div class="hero"><div class="wrap">'
    + (R.logo ? '<span class="plogo hero-logo"><img src="' + esc(R.logo) + '" alt="" onerror="this.parentNode.style.display=\'none\'"></span>' : '')
    + '<div class="caps eyebrow">Google Ads report' + who + '</div>'
    + '<h1>' + words(R.name) + '</h1><div class="goldrule"></div>'
    + '<p class="lede">' + lede(P) + '</p>'
    + '<div class="hero-meta"><span>Period <b>' + esc(when(P.from)) + ' to ' + esc(when(P.to, true)) + '</b></span>'
    + '<span>Compared with <b>' + esc(when(P.prevFrom)) + ' to ' + esc(when(P.prevTo, true)) + '</b></span>'
    + '<span>Updated <b>' + esc(R.updatedText) + '</b></span></div>'
    + '<div class="cue noprint"><i></i>Scroll</div>'
    + '</div></div>';
}

/* ---------------- headline numbers, each with its daily line ---------------- */
function spark(P, i, key){
  var d = (P.daily || []).map(function(r){ return Number(r[i]) || 0; });
  if (d.length < 2 || !d.some(function(v){ return v > 0; })) return '';
  var mx = Math.max.apply(null, d) || 1, W = 200, H = 34;
  var pts = d.map(function(v, k){ return (k / (d.length - 1) * W).toFixed(1) + ',' + (H - 3 - v / mx * (H - 6)).toFixed(1); }).join(' ');
  return '<svg class="sp draw" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + pts + '" fill="none" style="stroke:var(--mute)" stroke-width="1.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
}
function kpis(P){
  var t = P.totals, p = P.prev, c = P.compare;
  function k(label, val, key, d, sp){ return '<div class="kpi"><div class="caps">' + label + '</div><div class="v num">' + num(val, key) + '</div><div class="d">' + esc(d) + '</div>' + (sp || '') + '</div>'; }
  function st(label, val, key, d){ return '<div class="stat"><div class="caps">' + label + '</div><div class="v num">' + num(val, key) + '</div><div class="d">' + esc(d) + '</div></div>'; }
  var cpa = rate(t.cost, t.conv), pcpa = rate(p.cost, p.conv);
  return '<div class="kpis" style="margin-top:0">'
    + k('Spend', moneyShort(t.cost), 'k-cost', 'Invested in Google Ads')

/* Numbers never clip: each group shrinks just enough for its longest final
   number and then shares that size. Labels in a group share a height. */
function fitGroup(sel, minPx){
  var els = [].slice.call(document.querySelectorAll(sel)); if (!els.length) return;
  var saved = els.map(function(e){ var c = e.querySelector('[data-final]'); if (c){ var t = c.textContent; c.textContent = c.getAttribute('data-final'); return [c, t]; } return null; });
  els.forEach(function(e){ e.style.fontSize = ''; });
  var base = parseFloat(getComputedStyle(els[0]).fontSize) || 30, size = base;
  els.forEach(function(e){
    var f = size;
    e.style.fontSize = f + 'px';
    while (e.scrollWidth > e.clientWidth + 0.5 && f > minPx){ f -= 1; e.style.fontSize = f + 'px'; }
    size = Math.min(size, f);
  });
  els.forEach(function(e){ e.style.fontSize = size + 'px'; });
  saved.forEach(function(x){ if (x) x[0].textContent = x[1]; });
}
function evenGroup(sel){
  var els = [].slice.call(document.querySelectorAll(sel)); if (!els.length) return;
  els.forEach(function(e){ e.style.minHeight = ''; });
  var h = Math.max.apply(null, els.map(function(e){ return e.getBoundingClientRect().height; }));
  els.forEach(function(e){ e.style.minHeight = Math.ceil(h) + 'px'; });
}
function tidy(){

/* ---------------- daily chart: draws in, crosshair on hover, touch or arrow keys ---------------- */
function trend(P, ix){
  var cur = P.daily || [], prev = P.prevDaily || [], i = MI[S.metric];
  var sum = function(a){ return a.reduce(function(x, r){ return x + (Number(r[i]) || 0); }, 0); };
  var showPrev = S.metric !== 'cost' && prev.length > 1 && sum(cur) >= sum(prev);
  if (!showPrev) prev = [];
  var n = cur.length; if (n < 2) return '';
  var vals = cur.map(function(r){ return r[i]; }).concat(prev.map(function(r){ return r[i]; }));
  var max = Math.max.apply(null, vals.concat([0])) || 1, W = 1000, H = 280;
  function X(k){ return (k / (n - 1)) * W; }
  function Y(v){ return H - 6 - (v / max) * (H - 26); }
  function line(a){ return a.map(function(r, k){ return (k ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(r[i]).toFixed(1); }).join(' '); }
  var grid = '';
  for (var g = 1; g <= 3; g++){ var gy = (H / 4) * g; grid += '<line x1="0" y1="' + gy + '" x2="' + W + '" y2="' + gy + '" style="stroke:var(--soft2)" stroke-width="1" vector-effect="non-scaling-stroke"/>'; }
  var pk = 0; cur.forEach(function(r, k){ if (r[i] > cur[pk][i]) pk = k; });
  var peak = cur[pk][i] > 0 ? '<line x1="' + X(pk).toFixed(1) + '" y1="0" x2="' + X(pk).toFixed(1) + '" y2="' + H + '" stroke="#CDA176" stroke-width="1" vector-effect="non-scaling-stroke"/>' : '';
  var area = line(cur) + ' L' + W + ' ' + H + ' L0 ' + H + ' Z';
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + grid
    + '<g class="draw"><path class="area" d="' + area + '"/>' + peak
    + (prev.length > 1 ? '<path d="' + line(prev) + '" fill="none" stroke="#A8AAAB" stroke-width="1.6" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>' : '')
    + '<path d="' + line(cur) + '" fill="none" style="stroke:var(--black)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></g>'
    + '<line x1="0" y1="' + H + '" x2="' + W + '" y2="' + H + '" style="stroke:var(--black)" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>';
  CH.trend = { cur: cur, prev: prev, i: i, max: max, H: H, n: n, label: P.label, compare: P.compare };
  var mid = cur[Math.floor((n - 1) / 2)];
  var desc = METRICS[S.metric] + ' by day, ' + P.label + '. Highest on ' + when(cur[pk][0]) + ' at ' + fmtMetric(cur[pk][i]) + '.';
  return '<section class="sec rv" id="s-trend">' + secHead(METRICS[S.metric] + ' by day', showPrev ? (P.label + ' compared with ' + P.compare) : P.label, metricSeg(), ix)
    + '<div class="chart" id="trendChart" tabindex="0" role="img" aria-label="' + esc(desc) + '"><span class="ymax">' + esc(fmtMetric(max)) + '</span>' + svg
    + '<div class="xh"></div>' + (showPrev ? '<div class="dotp pv"></div>' : '') + '<div class="dotp cu"></div><div class="tip"></div></div>'
    + '<div class="axis"><span>' + esc(when(cur[0][0])) + '</span><span>' + (mid ? esc(when(mid[0])) : '') + '</span><span>' + esc(when(cur[n - 1][0])) + '</span></div>'
    + '<div class="legend"><span><i></i>' + esc(P.label) + '</span>' + (showPrev ? '<span><i class="prev"></i>' + esc(P.compare.charAt(0).toUpperCase() + P.compare.slice(1)) + '</span>' : '')
    + (peak ? '<span><i class="peak"></i>Busiest day, ' + esc(when(cur[pk][0])) + '</span>' : '') + '<span class="noprint">Hover, touch or use the arrow keys to explore</span></div></section>';
}
function wireCharts(){
  S.outside = [];
  var el = $('trendChart'), d = CH.trend;
  if (el && d){
    var idx = d.n - 1;
    var show = function(k){
      idx = Math.max(0, Math.min(d.n - 1, k));
      var c = d.cur[idx], p = d.prev[idx], W = el.clientWidth, Hp = el.clientHeight;
      var x = d.n > 1 ? idx / (d.n - 1) * W : 0;
      var yy = function(v){ return (d.H - 6 - (v / d.max) * (d.H - 26)) / d.H * Hp; };
      el.querySelector('.xh').style.left = x + 'px';
      var dc = el.querySelector('.dotp.cu'); dc.style.left = x + 'px'; dc.style.top = yy(c[d.i]) + 'px';
      var dp = el.querySelector('.dotp.pv'); if (dp && p){ dp.style.left = x + 'px'; dp.style.top = yy(p[d.i]) + 'px'; }
      if (el.getAttribute('data-head')){
        var hv = $('mHv'), hs = $('mHs');
        if (hv){ hv.textContent = cptMetric(c[d.i]); hs.textContent = when(c[0], true) + (p ? ' \u00b7 Previous ' + cptMetric(p[d.i]) : ''); }
      }
      var tip = el.querySelector('.tip');
      tip.innerHTML = '<div class="tl">' + esc(when(c[0], true)) + '</div><div class="tv">' + esc(fmtMetric(c[d.i])) + '</div>' + (p ? '<div class="tp">' + esc(when(p[0])) + ': ' + esc(fmtMetric(p[d.i])) + '</div>' : '');
      var tw = tip.offsetWidth, left = x + 16; if (left + tw > W) left = x - tw - 16; if (left < 0) left = 0;
      tip.style.left = left + 'px'; tip.style.top = Math.max(0, Math.min(Hp - tip.offsetHeight, yy(c[d.i]) - tip.offsetHeight - 14)) + 'px';
      el.classList.add('on-hover');
    };
    var at = function(ev){ var r = el.getBoundingClientRect(); return Math.round((ev.clientX - r.left) / r.width * (d.n - 1)); };
    el.addEventListener('pointermove', function(ev){ show(at(ev)); });
    el.addEventListener('pointerdown', function(ev){ show(at(ev)); });
    var clear = function(){ el.classList.remove('on-hover'); var hv = $('mHv'), hs = $('mHs'); if (el.getAttribute('data-head') && hv){ hv.textContent = hv.getAttribute('data-d'); hs.textContent = hs.getAttribute('data-d'); } };
    el.addEventListener('pointerleave', function(ev){ if (ev.pointerType === 'mouse') clear(); });
    S.outside.push(function(t){ if (!el.contains(t)) clear(); });
    el.addEventListener('focus', function(){ show(idx); });
    el.addEventListener('blur', clear);
    el.addEventListener('keydown', function(ev){
      if (ev.key === 'ArrowLeft'){ show(idx - 1); ev.preventDefault(); }
      else if (ev.key === 'ArrowRight'){ show(idx + 1); ev.preventDefault(); }
      else if (ev.key === 'Home'){ show(0); ev.preventDefault(); } else if (ev.key === 'End'){ show(d.n - 1); ev.preventDefault(); }
    });
  }
  [].forEach.call(document.querySelectorAll('.dn'), function(dn){
    var c = dn.querySelector('.dn-c'), lg = dn.querySelector('.lg'), mv = dn.querySelector('.dn-m .v'), ml = dn.querySelector('.dn-m .l');
    var base = [mv.textContent, ml.textContent];
    var pick = function(k){
      [].forEach.call(dn.querySelectorAll('[data-i]'), function(x){ x.classList.toggle('hi', x.getAttribute('data-i') === String(k)); });
      c.classList.toggle('dim', k !== null); lg.classList.toggle('dim', k !== null);
      if (k === null){ mv.textContent = base[0]; ml.textContent = base[1]; return; }
      var seg = dn.querySelector('circle[data-i="' + k + '"]');
      mv.textContent = seg.getAttribute('data-v'); ml.textContent = seg.getAttribute('data-l');
    };
    /* a mouse previews on hover; touch and pen need a deliberate tap */
    [].forEach.call(dn.querySelectorAll('[data-i]'), function(x){
      x.addEventListener('pointerenter', function(ev){ if (ev.pointerType === 'mouse') pick(x.getAttribute('data-i')); });
      x.addEventListener('click', function(){ pick(x.getAttribute('data-i')); });
    });
    dn.addEventListener('pointerleave', function(ev){ if (ev.pointerType === 'mouse') pick(null); });
  });
}

/* types the search out once, when it comes into view */
function typeOut(sec){
  var q = sec.querySelector('.q[data-type]'); if (!q || q.getAttribute('data-done')) return;

  if (reduced()){ q.textContent = full; return; }
  var t0 = null, per = 45;
  q.innerHTML = '<span></span><i class="k"></i>';

  function step(ts){

}

/* ============================== PHONE REPORT ==============================
   Built for the phone rather than shrunk from the desktop: a summary first,
   then four equal tiles, detail rows, highlights, then detail. Numbers use
   one fixed size per role and short forms (98.8M, $123K) instead of shrinking. */
function cpt(v, kind){
  v = Number(v) || 0; var a = Math.abs(v);
