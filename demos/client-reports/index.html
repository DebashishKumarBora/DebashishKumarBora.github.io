  /* refresh and settings */
  h += '<div class="card"><div class="card-h"><div><h3>Automatic refresh</h3><p>Reads Google Ads in the background and saves each client\u2019s numbers in their own private file. Client visits never call Google Ads.</p></div></div>'
    + '<div class="f"><div><label for="autoH">Refresh every</label><select id="autoH">' + [0, 2, 4, 6, 8, 12].map(function(n){ return '<option value="' + n + '"' + (a.auto.hours === n ? ' selected' : '') + '>' + (n ? n + ' hours' : 'Off, refresh by hand') + '</option>'; }).join('') + '</select></div></div>'
    + '<div class="btns" style="margin-top:16px"><button class="btn dark" onclick="adminAuto()">Save</button></div></div>';
  h += '<div class="card"><div class="card-h"><div><h3>Settings</h3><p>Admins can open this console with the link ending in ?admin=1. The script owner is always an admin.</p></div></div>'
    + '<div class="f"><div><label for="sAdm">Admin emails</label><input id="sAdm" value="' + esc(a.admins.join(', ')) + '"><div class="hint">Comma separated. They must be signed in to a Vertex Google account.</div></div>'
    + '<div><label for="sLogoL">Logo for light backgrounds (https link)</label><input id="sLogoL" value="' + esc(a.brand.logoLight || '') + '"><div class="hint">The black Vertex logo. Leave empty to use the Vertex wordmark.</div></div>'
    + '<div><label for="sLogoD">Logo for dark backgrounds (https link)</label><input id="sLogoD" value="' + esc(a.brand.logoDark || '') + '"><div class="hint">The white Vertex logo.</div></div>'
    + '<div><label for="sAiKey">Anthropic API key, for the top campaign write up</label><input id="sAiKey" type="password" autocomplete="off" placeholder="' + esc(a.ai.hasKey ? 'Saved: ' + a.ai.key : 'sk-ant-...') + '"><div class="hint">Without a key, a standard positive sentence is used. Every number Claude writes is checked against the real figures before it is shown.</div></div>'
    + '<div><label for="sAiModel">Claude model</label><input id="sAiModel" value="' + esc(a.ai.model) + '"><div class="hint">Claude writes only when the numbers change, so a refresh with no change costs nothing.</div></div>'
    + '<div><label style="display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:14.5px;margin-top:24px"><input type="checkbox" id="sAiOn"' + (a.ai.on ? ' checked' : '') + '>Use Claude for the write up</label></div></div>'
    + '<div class="btns" style="margin-top:16px"><button class="btn dark" onclick="adminSettings()">Save settings</button>'
    + (a.folderUrl ? '<a class="btn quiet" href="' + esc(a.folderUrl) + '" target="_blank" rel="noopener">Private data folder</a>' : '') + (a.logUrl ? '<a class="btn quiet" href="' + esc(a.logUrl) + '" target="_blank" rel="noopener">Activity sheet</a>' : '') + '</div></div>';
  h += '<div class="card"><div class="card-h"><div><h3>Activity</h3><p>Sign ins, report views, wrong passwords and admin changes.</p></div><button class="btn quiet" onclick="adminActivity()">Show recent activity</button></div><div id="act"></div></div>';
  h += '<div style="height:80px"></div></div></div>';
  $('app').innerHTML = h;
}
function fld(id, label, val, type, ph){
  return '<div><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + type + '" autocomplete="off" placeholder="' + esc(val ? ('Saved: ' + val) : (ph || '')) + '"></div>';
}
function busy(id, on, label){ var b = $(id); if (b){ b.disabled = on; if (label) b.textContent = label; } }

function adminSaveCreds(){
  busy('saveCreds', true, 'Testing');
  call('adminSaveCredentials', { devToken: $('cDev').value, managerId: $('cMgr').value, clientId: $('cCid').value, clientSecret: $('cSec').value, refreshToken: $('cRef').value, apiVersion: $('cVer').value.trim() }).then(function(r){
    if (!r || r.error){ busy('saveCreds', false, 'Save and test'); $('credMsg').innerHTML = '<div class="err">' + esc((r && r.error) || 'Not saved.') + '</div>'; return; }
    toast('Connected. Found ' + r.accounts + ' Google Ads accounts.'); adminLoad();
  }).catch(function(e){ busy('saveCreds', false, 'Save and test'); $('credMsg').innerHTML = '<div class="err">' + esc(e.message || e) + '</div>'; });
}
function adminCreateAll(){
  busy('createAll', true, 'Adding');
  call('adminCreateAll').then(function(r){
    if (!r || r.error){ toast((r && r.error) || 'Not added.'); busy('createAll', false); return; }
    toast('Added ' + r.created.length + ' clients. Next: create their passwords.'); adminLoad();
  });
}
function adminRefresh(ids){
  var all = !ids.length;
  if (all) busy('refAll', true, 'Refreshing'); else toast('Refreshing. This takes a few seconds.');
  call('adminRefresh', ids).then(function(r){
    if (!r || r.error){ toast((r && r.error) || 'Refresh failed.'); busy('refAll', false, 'Refresh all now'); return; }
    if (r.left && r.left.length){ toast('Refreshed ' + r.done.length + '. Continuing with ' + r.left.length + ' more.'); adminRefresh(r.left); return; }
    toast(r.failed.length ? ('Refreshed ' + r.done.length + '. ' + r.failed.length + ' failed, see the list.') : ('Refreshed ' + r.done.length + (r.done.length === 1 ? ' client.' : ' clients.')));
    adminLoad();
  }).catch(function(e){ toast('Refresh failed. ' + (e.message || e)); adminLoad(); });
}
function adminPassword(id){
  var c = S.A.clients.filter(function(x){ return x.id === id; })[0];
  if (c.hasPassword && !confirm('Create a new password for ' + c.name + '? The old one stops working right away, and anyone signed in with it is signed out.')) return;
  call('adminNewPassword', id).then(function(r){
    if (!r || r.error){ toast((r && r.error) || 'Not created.'); return; }
    var msg = 'Hello,\n\nYour Google Ads report for ' + r.name + ' is ready.\n\nLink: ' + S.A.link + '\nPassword: ' + r.password + '\n\nThe report updates several times a day. Please keep the password private.\n\nYour Vertex marketing team';
    $('modal').innerHTML = '<div class="mask" onclick="if(event.target===this)closeModal()"><div class="dlg" role="dialog" aria-modal="true"><div class="caps">New password \u00b7 ' + esc(r.name) + '</div>'
      + '<div class="pw num" id="newPw">' + esc(r.password) + '</div>'
      + '<p class="hint" style="font-size:14px">Copy it now. For safety it is not stored and cannot be shown again. If it is lost, create a new one.</p>'
      + '<div class="btns" style="margin-top:20px"><button class="btn dark" onclick="copyText(' + esc(JSON.stringify(r.password)) + ',\'Password copied.\')">Copy password</button>'
      + '<button class="btn" onclick="copyText(document.getElementById(\'msgBody\').value,\'Message copied.\')">Copy message for the client</button><button class="btn quiet" onclick="closeModal();adminLoad()">Done</button></div>'
      + '<div class="f" style="margin-top:20px"><div><label for="msgBody">Message</label><textarea id="msgBody" rows="9" readonly>' + esc(msg) + '</textarea></div></div></div></div>';
    fitGroup('.dlg .pw', 16);
  });
}
function closeModal(){ $('modal').innerHTML = ''; }
function adminPreview(id){
  toast('Opening the preview.');
  call('adminPreview', id).then(function(r){
    if (!r || r.error){ toast((r && r.error) || 'Could not open the preview.'); return; }
    S.R = r; S.preview = id; S.period = 'last30'; render(); window.scrollTo(0, 0);
  });
}
var SECTION_INFO = [
  ['wins', 'At a glance', 'The strongest real wins, records and 12 month totals'],
  ['story', 'Recap story', 'The swipeable recap of the period'],
  ['top', 'Top campaign', 'Its best numbers and a short positive write up'],
  ['weekdays', 'Best day of the week', 'One sentence naming the weekday that brings the most visits'],
  ['timeline', 'Vertex timeline', 'What we did and what is coming next, written below'],
  ['devices', 'Devices', 'Share of clicks from phones, computers and tablets'],
  ['ads', 'Ads', 'The most shown search ads, as written'],
  ['searches', 'Searches', 'Top 3 searches, words only, protected class terms removed'],
  ['notes', 'Note from Vertex', 'The note written below']
];
function adminEdit(id){
  var a = S.A, c = id ? a.clients.filter(function(x){ return x.id === id; })[0] : { id: '', name: '', enabled: true, accounts: [], sections: {}, notes: '' };
  var mine = {}; c.accounts.forEach(function(x){ mine[x.id.replace(/\D/g, '')] = 1; });
  var accts = a.accounts.map(function(x){ return '<label><input type="checkbox" name="acct" value="' + esc(x.id) + '"' + (mine[x.id] ? ' checked' : '') + '><span>' + esc(x.name) + '<span class="t"> ' + esc(x.id.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3')) + '</span></span></label>'; }).join('');
  var secs = SECTION_INFO.map(function(s){ return '<label><input type="checkbox" name="sec" value="' + s[0] + '"' + (c.sections[s[0]] !== false ? ' checked' : '') + '><span>' + s[1] + '<span class="t">' + s[2] + '</span></span></label>'; }).join('');
  $('modal').innerHTML = '<div class="mask"><div class="dlg" role="dialog" aria-modal="true"><h3>' + (id ? 'Edit ' + esc(c.name) : 'Add a client') + '</h3>'
    + '<div class="f" style="margin-top:20px"><div><label for="eName">Client name, as the client sees it</label><input id="eName" value="' + esc(c.name) + '"></div></div>'
    + '<div style="margin-top:18px"><label class="caps" style="display:block;margin-bottom:8px">Google Ads accounts in this report</label><div class="checks">' + (accts || '<div class="hint">No accounts found. Check the connection.</div>') + '</div><div class="hint">Pick more than one to combine them into one report.</div></div>'
    + '<div style="margin-top:18px"><label class="caps" style="display:block;margin-bottom:8px">What the client sees</label><div class="tog">' + secs + '</div><div class="hint">Headline numbers are always shown. Anything switched off here is never sent to the client\u2019s browser.</div></div>'
    + '<div style="margin-top:18px"><label class="caps" style="display:block;margin-bottom:8px">Vertex timeline</label><div id="tlRows">' + (c.timeline || []).map(tlRow).join('') + '</div>'
    + '<button class="btn quiet" type="button" onclick="tlAdd()" style="margin-top:8px">Add an entry</button><div class="hint">Dated work you did for this client. Tick "Coming next" for planned work. Up to 20 entries, newest kept.</div></div>'
    + '<div class="f" style="margin-top:18px"><div><label for="eLogo">Property logo (https link, optional)</label><input id="eLogo" value="' + esc(c.logo || '') + '" placeholder="https://"><div class="hint">Shown on the report cover on a white tile.</div></div></div>'
    + '<div class="f" style="margin-top:18px"><div><label for="eNotes">Note from Vertex (optional)</label><textarea id="eNotes" rows="4" maxlength="2000" placeholder="For example: We added a new search campaign for the fall open house on October 3.">' + esc(c.notes) + '</textarea><div class="hint">Shown at the end of the report with today\u2019s date.</div></div></div>'
    + '<div style="margin-top:14px"><label style="display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:14.5px"><input type="checkbox" id="eOn"' + (c.enabled ? ' checked' : '') + '>Report is live. Untick to pause it without deleting anything.</label></div>'
    + '<div id="eErr"></div><div class="btns" style="margin-top:22px"><button class="btn dark" id="eSave" onclick="adminSaveClient(\'' + (id || '') + '\')">Save</button><button class="btn quiet" onclick="closeModal()">Cancel</button>'
    + (id ? '<button class="btn quiet" style="margin-left:auto" onclick="adminDelete(\'' + id + '\')">Remove client</button>' : '') + '</div></div></div>';
}
function adminSaveClient(id){
  var accts = [].slice.call(document.querySelectorAll('input[name=acct]:checked')).map(function(x){ return x.value; });
  var sections = {}; [].slice.call(document.querySelectorAll('input[name=sec]')).forEach(function(x){ sections[x.value] = x.checked; });
  busy('eSave', true, 'Saving');
  var tl = [].slice.call(document.querySelectorAll('#tlRows .tlr')).map(function(r){ return { date: r.querySelector('input[type=date]').value, text: r.querySelector('input[type=text]').value, next: r.querySelector('input[type=checkbox]').checked }; });
  call('adminSaveClient', { id: id, name: $('eName').value, accounts: accts, sections: sections, notes: $('eNotes').value, enabled: $('eOn').checked, timeline: tl, logo: $('eLogo').value.trim() }).then(function(r){
    if (!r || r.error){ busy('eSave', false, 'Save'); $('eErr').innerHTML = '<div class="err">' + esc((r && r.error) || 'Not saved.') + '</div>'; return; }
    closeModal(); toast('Saved.'); adminLoad();
  });
}
function tlRow(x){
  x = x || {};
  return '<div class="tlr"><input type="date" class="in" value="' + esc(x.date || '') + '" aria-label="Date"><input type="text" class="in" maxlength="200" value="' + esc(x.text || '') + '" placeholder="What we did" aria-label="Entry">'
    + '<label class="tln"><input type="checkbox"' + (x.next ? ' checked' : '') + '>Coming next</label><button type="button" class="btn quiet" onclick="this.parentNode.remove()" aria-label="Remove entry">Remove</button></div>';
}
function tlAdd(){ var d = document.createElement('div'); d.innerHTML = tlRow({ date: new Date().toISOString().slice(0, 10) }); $('tlRows').appendChild(d.firstChild); }
function adminDelete(id){
  var c = S.A.clients.filter(function(x){ return x.id === id; })[0];
  if (!confirm('Remove ' + c.name + '? Their password stops working and their saved report is deleted. Google Ads is not affected.')) return;
  call('adminDeleteClient', id).then(function(){ closeModal(); toast('Removed.'); adminLoad(); });
}
function adminAuto(){
  call('adminAutoRefresh', Number($('autoH').value)).then(function(r){ toast(r && r.hours ? 'Refreshing every ' + r.hours + ' hours.' : 'Automatic refresh is off.'); adminLoad(); });
}
function adminSettings(){
  call('adminSaveSettings', { admins: $('sAdm').value, logoLight: $('sLogoL').value.trim(), logoDark: $('sLogoD').value.trim(), aiKey: $('sAiKey').value.trim(), aiModel: $('sAiModel').value.trim(), aiOn: $('sAiOn').checked }).then(function(){ toast('Settings saved.'); BOOT.brand = { logoLight: $('sLogoL').value.trim(), logoDark: $('sLogoD').value.trim() }; adminLoad(); });
}
function adminActivity(){
  $('act').innerHTML = '<div class="empty">Loading.</div>';
  call('adminActivity').then(function(r){
    if (!r || r.error){ $('act').innerHTML = '<div class="err">' + esc((r && r.error) || 'Could not load.') + '</div>'; return; }
    if (!r.rows.length){ $('act').innerHTML = '<div class="empty">Nothing yet.</div>'; return; }
    $('act').innerHTML = '<div class="tblw"><table class="atbl"><thead><tr><th>When</th><th>Client</th><th>What happened</th><th>Detail</th></tr></thead><tbody>'
      + r.rows.map(function(x){ return '<tr><td style="white-space:nowrap">' + esc(x.when) + '</td><td>' + esc(x.client || '\u00b7') + '</td><td>' + esc(x.what) + '</td><td>' + esc(x.detail) + '</td></tr>'; }).join('') + '</tbody></table></div>';
  });
}

window.addEventListener('load', boot);
</script>
</body>
</html>
